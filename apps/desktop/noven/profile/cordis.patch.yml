- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: noven-image
  name: "noven-image"
  config:
    baseURL: https://proxy.qianc.ltd/v1
    model: gpt-image-2.5
    apiKeyEnv: NOVEN_IMAGE_API_KEY
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: ui-settings-account
  config:
    developerTools: true
    version: 1
    step: done
    usage: detailed
    purpose: null
    process: standard
    completion: api-key
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
