# Noven Desktop profile patch. No credentials are stored here; providers reference environment-backed credential names only.
- id: ui-brand-official
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: workspace-controller
  name: "@deepseek-ai/dsh-api-workspace-controller"
  config:
    defaultWorkspaceDirectory: !!js "process.getBuiltinModule('node:path').join(process.env.NOVEN_PROJECTS_ROOT ?? '', '杂项')"
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      gmn:
        apiKeyEnv: GMN_API_KEY
        api: openai-completions
        baseURL: https://agiplan.dev/v1
        timeoutMs: 300000
        defaultInput:
          - text
          - image
        models:
          - id: claude-fable-5
            name: claude-fable-5
          - id: claude-fable-5-1
            name: claude-fable-5-1
          - id: claude-opus-4-8
            name: claude-opus-4-8
          - id: claude-opus-5
            name: claude-opus-5
          - id: claude-opus-5-5
            name: claude-opus-5-5
          - id: claude-sonnet-5
            name: claude-sonnet-5
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
          - id: deepseek-v4-pro
            name: deepseek-v4-pro
          - id: doubao-seed-2.0-mini
            name: doubao-seed-2.0-mini
          - id: doubao-seed-2.1-lite
            name: doubao-seed-2.1-lite
          - id: doubao-seed-2.1-pro
            name: doubao-seed-2.1-pro
          - id: doubao-seed-evolving
            name: doubao-seed-evolving
          - id: gemini-3.8-flash
            name: gemini-3.8-flash
          - id: gemini-3.8-flash-tiered
            name: gemini-3.8-flash-tiered
          - id: glm-5.3
            name: glm-5.3
          - id: glm-5.3-flash
            name: glm-5.3-flash
          - id: gpt-5.5
            name: gpt-5.5
          - id: gpt-5.6
            name: gpt-5.6
          - id: gpt-5.6-luna
            name: gpt-5.6-luna
          - id: gpt-5.6-sol
            name: gpt-5.6-sol
          - id: gpt-5.6-terra
            name: gpt-5.6-terra
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
          - id: gpt-6-astra
            name: gpt-6-astra
          - id: gpt-6-luna
            name: gpt-6-luna
          - id: gpt-6-sol
            name: gpt-6-sol
          - id: grok-4.5
            name: grok-4.5
          - id: grok-4.6
            name: grok-4.6
          - id: grok-4.7
            name: grok-4.7
          - id: kimi-k2.7-code
            name: kimi-k2.7-code
          - id: kimi-k2.8-preview
            name: kimi-k2.8-preview
          - id: kimi-k3
            name: kimi-k3
          - id: minimax-m3
            name: minimax-m3
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      opencode-go-gemini:
        displayName: OpenCode Go · Gemini
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: google-generative-ai
        baseURL: https://opencode.ai/inference/go/google/v1beta
        models:
          - id: gemini-4-argon
            name: Gemini 4 Argon
            contextWindow: 1048576
            maxTokens: 65536
            input:
              - text
              - image
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: noven-image
  name: "noven-image"
  config:
    baseURL: https://proxy.qianc.ltd/v1
    model: gpt-image-2.5
    apiKeyEnv: NOVEN_IMAGE_API_KEY
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: ui-settings-account
  config:
    developerTools: true
    version: 1
    step: done
    usage: detailed
    purpose: null
    process: standard
    completion: api-key
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
