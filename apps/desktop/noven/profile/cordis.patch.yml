# Noven Desktop profile patch. No credentials are stored here; providers reference environment-backed credential names only.
- id: ui-brand-official
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: workspace-controller
  name: "@deepseek-ai/dsh-api-workspace-controller"
  config:
    defaultWorkspaceDirectory: !!js "process.getBuiltinModule('node:path').join(process.env.NOVEN_PROJECTS_ROOT ?? '', '杂项')"
