<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>地图编辑器原型 · noven-draw-map</title>
<style>
  :root { --bg:#17150f; --panel:#221f17; --line:#3a3527; --fg:#e8e0cd; --dim:#9a917c; --accent:#d8a94e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .group { display: flex; gap: 4px; align-items: center; }
  header .group > span { color: var(--dim); margin-right: 2px; }
  button, select, input[type=text] { background: #2c2820; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button.on { background: var(--accent); color: #17150f; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0d0c08; }
  #stage canvas { position: absolute; inset: 0; }
  aside { width: 300px; background: var(--panel); border-left: 1px solid var(--line);
    padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 12px; color: var(--dim); margin: 0; text-transform: uppercase; letter-spacing: .08em; }
  aside .card { border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  aside textarea { width: 100%; height: 120px; background: #161410; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; font: 11px/1.4 ui-monospace, monospace; }
  aside input[type=color] { width: 32px; height: 24px; border: 1px solid var(--line); background: none; padding: 0; }
  aside input[type=range] { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row label { color: var(--dim); min-width: 44px; }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; }
  #palette .sw { width: 22px; height: 22px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
  #palette .sw.on { border-color: var(--fg); }
  #hint { position: absolute; left: 10px; bottom: 10px; background: rgba(23,21,15,.85);
    padding: 4px 10px; border-radius: 4px; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="group"><span>工具</span>
    <button data-mode="select" class="on">选择/拉伸</button>
    <button data-mode="lasso">圈</button>
    <button data-mode="smear">涂抹</button>
    <button data-mode="line">线</button>
    <button data-mode="mark">地标</button>
    <button data-mode="draft">草稿笔</button>
    <button data-mode="draftErase">草稿橡皮</button>
    <button data-mode="addPaint">加面</button>
    <button data-mode="subPaint">减面</button>
  </div>
  <div class="group"><span>图层</span>
    <select id="layerSel"></select>
  </div>
  <div class="group"><span>笔刷</span>
    <input id="brushR" type="range" min="2" max="120" value="30" style="width:90px">
    <span id="brushRVal">30</span>
  </div>
  <div class="group">
    <button id="gridBtn" class="on">坐标</button>
    <button id="disputeBtn" class="on">争议</button>
    <button id="undoBtn">撤销</button>
    <button id="redoBtn">重做</button>
  </div>
  <div class="group">
    <button id="uploadBtn">载入底图</button>
    <button id="draftToBase">草稿→底图</button>
    <input id="fileInput" type="file" accept="image/*" hidden>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="cvBase"></canvas>
    <canvas id="cvDraft"></canvas>
    <canvas id="cvGrid"></canvas>
    <canvas id="cvObj"></canvas>
    <canvas id="cvFx"></canvas>
    <div id="hint"></div>
  </div>
  <aside>
    <div class="card" id="objCard" hidden>
      <h2>对象</h2>
      <div class="row"><label>名称</label><input type="text" id="objName"></div>
      <div class="row"><label>颜色</label><input type="color" id="objColor"><span id="objInfo" style="color:var(--dim)"></span></div>
      <div class="row" id="widthRow" hidden><label>宽度</label><input type="range" id="objWidth" min="2" max="80"></div>
      <div class="row"><button id="objDel">删除</button><button id="objRename">命名确定</button></div>
    </div>
    <div class="card">
      <h2>语义色（草稿）</h2>
      <div id="palette"></div>
      <div class="row"><input type="color" id="palColor" value="#7ec8e3"><input type="text" id="palName" placeholder="名称" style="width:70px"><input type="text" id="palDesc" placeholder="描述(给AI)" style="flex:1"></div>
      <div class="row"><button id="palAdd">添加语义色</button></div>
    </div>
    <div class="card">
      <h2>AI 读写（map-scene.json）</h2>
      <div class="row"><button id="exportBtn">导出</button><button id="copyBtn">复制</button><button id="importBtn">导入</button></div>
      <textarea id="aiBox" placeholder='导入格式: {"ops":[{"op":"upsert","object":{...}}]} 或整份导出文档'></textarea>
    </div>
    <div class="card" style="color:var(--dim);font-size:11px">
      圈: 一笔自动闭合 · 涂抹: 取最外围轮廓 · 线: 骨架+宽度, 端点吸附已有骨架/地标<br>
      拉伸: 按住边界拖(带衰减) · 内部拖动=整体移动 · Alt+拖线节点=局部宽度<br>
      争议: 同层面重叠自动标红 · 滚轮缩放 · 空格+拖=平移
    </div>
  </aside>
</main>
<script>
'use strict'
/* =========================================================================
 * Map editor prototype. World coordinates = base-image pixels (the smallest
 * unit the model sees). Everything the model reads/writes goes through
 * map-scene.json; the renderer is only a projection of that vector state.
 * ========================================================================= */

const W0 = 1600, H0 = 1000            // default canvas when no base image is loaded

const LAYERS = [
  { id: 'region',   label: '区域',   kind: 'face' },
  { id: 'kingdom',  label: '王国',   kind: 'face' },
  { id: 'faction',  label: '势力',   kind: 'face' },
  { id: 'road',     label: '道路',   kind: 'line' },
  { id: 'river',    label: '河流',   kind: 'line' },
  { id: 'landmark', label: '地标',   kind: 'mark' },
]

const state = {
  doc: {
    version: 1,
    canvas: { width: W0, height: H0 },
    objects: [],          // face|line|mark records (see serialize())
    palette: [
      { name: '海',   desc: 'ocean water',        color: '#3a6ea5' },
      { name: '陆',   desc: 'land',               color: '#8a7a55' },
      { name: '山',   desc: 'mountains',          color: '#6d6d6d' },
      { name: '森林', desc: 'forest',             color: '#3f6b3f' },
      { name: '沙漠', desc: 'desert',             color: '#c8b06a' },
    ],
    layersHidden: {},     // layerId -> true when hidden
    draftVisible: true,
  },
  view: { zoom: 1, panX: 0, panY: 0 },
  tool: { mode: 'select', layer: 'kingdom', r: 30, color: '#d8a94e', palColor: '#3a6ea5' },
  sel: null,              // selected object record or null
  stroke: null,           // live stroke while drawing
  stretch: null,          // live stretch edit
  space: false,
  undoStack: [], redoStack: [],
}
let seq = 1
const nid = p => `${p}${seq++}`

/* ---------- canvas stack ---------- */
const cv = {}
for (const id of ['cvBase', 'cvDraft', 'cvGrid', 'cvObj', 'cvFx']) cv[id] = document.getElementById(id)
const ctx = {}
for (const id in cv) ctx[id] = cv[id].getContext('2d')
// draft layer is an offscreen world-res bitmap; cvDraft only blits it
const draftBmp = document.createElement('canvas')
draftBmp.width = W0; draftBmp.height = H0
const draftCtx = draftBmp.getContext('2d')
const baseBmp = document.createElement('canvas')   // current base image at world res
baseBmp.width = W0; baseBmp.height = H0
const baseCtx = baseBmp.getContext('2d')

const stage = document.getElementById('stage')
const hint = document.getElementById('hint')

function fitCanvases() {
  for (const id in cv) { cv[id].width = stage.clientWidth; cv[id].height = stage.clientHeight }
  renderAll()
}
window.addEventListener('resize', fitCanvases)

/* ---------- view transform ---------- */
function toWorld(e) {
  const r = cv.cvFx.getBoundingClientRect()
  return [(e.clientX - r.left - state.view.panX) / state.view.zoom,
          (e.clientY - r.top - state.view.panY) / state.view.zoom]
}
function applyView(c) {
  c.setTransform(state.view.zoom, 0, 0, state.view.zoom, state.view.panX, state.view.panY)
}

/* ---------- geometry helpers ---------- */
const dist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1]
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)))
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy))
}
function polyDist(p, pts, closed) {
  let d = Infinity
  const n = pts.length
  for (let i = 0; i < n - (closed ? 0 : 1); i++) d = Math.min(d, segDist(p, pts[i], pts[(i + 1) % n]))
  return d
}
function inPoly(p, pts) {
  let inside = false
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    if ((pts[i][1] > p[1]) !== (pts[j][1] > p[1]) &&
        p[0] < (pts[j][0] - pts[i][0]) * (p[1] - pts[i][1]) / (pts[j][1] - pts[i][1]) + pts[i][0]) inside = !inside
  }
  return inside
}
function polyArea(pts) {
  let a = 0
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += pts[j][0] * pts[i][1] - pts[i][0] * pts[j][1]
  return a / 2
}
function polyCentroid(pts) {
  let x = 0, y = 0
  for (const p of pts) { x += p[0]; y += p[1] }
  return [x / pts.length, y / pts.length]
}
function polyBBox(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9
  for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]) }
  return [x0, y0, x1, y1]
}
/** Douglas-Peucker; keeps endpoints; closed=false. */
function simplify(pts, eps) {
  if (pts.length < 3) return pts.slice()
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1
  const stack = [[0, pts.length - 1]]
  while (stack.length) {
    const [a, b] = stack.pop()
    let dmax = 0, idx = -1
    for (let i = a + 1; i < b; i++) {
      const d = segDist(pts[i], pts[a], pts[b])
      if (d > dmax) { dmax = d; idx = i }
    }
    if (dmax > eps) { keep[idx] = 1; stack.push([a, idx], [idx, b]) }
  }
  return pts.filter((_, i) => keep[i])
}
/** Chaikin corner-cut once, for the "rubber band" look. Closed only. */
function smoothClosed(pts) {
  const out = []
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length]
    out.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25],
             [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75])
  }
  return out
}
/** Arc-length falloff pull: grab index moves by delta, neighbours decay with gauss(arcDist/sigma). */
function pullRing(pts, grab, delta, sigma, closed) {
  const n = pts.length
  const arc = [0]
  for (let i = 1; i <= n; i++) arc[i] = arc[i - 1] + Math.hypot(pts[i % n][0] - pts[i - 1][0], pts[i % n][1] - pts[i - 1][1])
  const total = closed ? arc[n] : arc[n - 1]
  const out = pts.map(p => p.slice())
  const arcAt = i => i <= grab ? arc[i] : (closed ? arc[i] : arc[i])
  for (let i = 0; i < n; i++) {
    if (i === grab) { out[i][0] += delta[0]; out[i][1] += delta[1]; continue }
    let d = Math.abs(arcAt(i) - arcAt(grab) < arcAt(grab) ? arc[i] + total - arcAt(grab) : arc[i] - arcAt(grab))
    if (closed) d = Math.min(d, total - d)
    const w = Math.exp(-(d * d) / (sigma * sigma))
    out[i][0] += delta[0] * w; out[i][1] += delta[1] * w
  }
  return out
}
/** Re-densify long edges, then prune with DP. Keeps the rope smooth after stretches. */
function maintain(pts, closed, maxSeg = 16, eps = 1.4) {
  const dense = []
  const n = pts.length
  const edges = closed ? n : n - 1
  for (let i = 0; i < edges; i++) {
    const a = pts[i], b = pts[(i + 1) % n]
    dense.push(a)
    const d = Math.hypot(b[0] - a[0], b[1] - a[1])
    const k = Math.min(8, Math.floor(d / maxSeg))
    for (let s = 1; s <= k; s++) dense.push([a[0] + (b[0] - a[0]) * s / (k + 1), a[1] + (b[1] - a[1]) * s / (k + 1)])
  }
  if (!closed) dense.push(pts[n - 1])
  let out = closed ? simplify([...dense, dense[0]], eps) : simplify(dense, eps)
  if (closed && out.length > 1) out.pop()   // drop duplicated closing point
  return out.slice(0, 600)
}

/* ---------- marching-squares outer contour (smear -> face) ---------- */
function extractOuterContour(alpha, w, h) {
  // edges keyed by stable ids: h<i>,<j> = horizontal edge of cell(i,j) top; v = vertical left
  const segByEdge = new Map()   // edgeId -> array of segment objects {a:pt,b:pt,ea,eb,used}
  const edgePt = (id) => {
    const [k, i, j] = id.split(':')
    return k === 'h' ? [+i, +j] : [+i, +j]
  }
  const segs = []
  const pt = (kind, i, j, a1, a2) => {   // interpolated crossing on an edge
    const t = a1 === a2 ? .5 : Math.max(0, Math.min(1, (127 - a1) / (a2 - a1)))
    return kind === 'h' ? [i + t, j] : [i, j + t]
  }
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : alpha[y * w + x]
  for (let j = 0; j < h - 1; j++) {
    for (let i = 0; i < w - 1; i++) {
      const tl = at(i, j), tr = at(i + 1, j), br = at(i + 1, j + 1), bl = at(i, j + 1)
      const idx = (tl > 127 ? 1 : 0) | (tr > 127 ? 2 : 0) | (br > 127 ? 4 : 0) | (bl > 127 ? 8 : 0)
      if (idx === 0 || idx === 15) continue
      const E = {
        T: `h:${i},${j}`, B: `h:${i},${j + 1}`, L: `v:${i},${j}`, R: `v:${i + 1},${j}`,
      }
      const P = {
        T: pt('h', i, j, tl, tr), B: pt('h', i, j + 1, bl, br),
        L: pt('v', i, j, tl, bl), R: pt('v', i + 1, j, tr, br),
      }
      const TABLE = {
        1: ['LT'], 2: ['TR'], 3: ['LR'], 4: ['RB'], 6: ['TB'], 7: ['LB'],
        8: ['LB'], 9: ['TB'], 11: ['RB'], 12: ['LR'], 13: ['TR'], 14: ['TL'],
      }
      let pairs = TABLE[idx]
      if (idx === 5) pairs = (tl + tr + br + bl) / 4 > 127 ? ['TR', 'LB'] : ['TL', 'RB']
      if (idx === 10) pairs = (tl + tr + br + bl) / 4 > 127 ? ['TL', 'RB'] : ['TR', 'LB']
      for (const [a, b] of pairs) {
        const s = { a: P[a], b: P[b], ea: E[a], eb: E[b], used: false }
        const si = segs.push(s) - 1
        for (const e of [E[a], E[b]]) {
          if (!segByEdge.has(e)) segByEdge.set(e, [])
          segByEdge.get(e).push(si)
        }
      }
    }
  }
  // chain segments into closed loops; keep the loop with the largest area
  let best = null, bestArea = 0
  for (let i = 0; i < segs.length; i++) {
    if (segs[i].used) continue
    const loop = []
    let cur = segs[i], end = null
    cur.used = true
    loop.push(cur.a, cur.b)
    end = cur.eb
    let guard = segs.length + 8
    while (guard-- > 0) {
      const next = (segByEdge.get(end) || []).find(si => !segs[si].used)
      if (next === undefined) break
      cur = segs[next]; cur.used = true
      end = cur.ea === end ? cur.eb : cur.ea
      loop.push(end === cur.ea ? cur.a : cur.b)
      if (next === i) break
    }
    const area = Math.abs(polyArea(loop))
    if (area > bestArea) { bestArea = area; best = loop }
  }
  return best
}

/* ---------- rasterize helpers ---------- */
const raster = document.createElement('canvas')
const rctx = raster.getContext('2d', { willReadFrequently: true })
function rasterPath(pts, closed) {
  rctx.beginPath()
  rctx.moveTo(pts[0][0], pts[0][1])
  for (let i = 1; i < pts.length; i++) rctx.lineTo(pts[i][0], pts[i][1])
  if (closed) rctx.closePath()
}
function faceAlpha(pts, w, h) {
  raster.width = w; raster.height = h
  rctx.clearRect(0, 0, w, h)
  rctx.fillStyle = '#fff'
  rasterPath(pts, true); rctx.fill()
  const img = rctx.getImageData(0, 0, w, h)
  const a = new Uint8Array(w * h)
  for (let i = 0; i < a.length; i++) a[i] = img.data[i * 4 + 3]
  return a
}
function stampStroke(path, r, sign /*1 add, 0 erase*/, target /*canvas ctx*/, w, h) {
  target.save()
  target.globalCompositeOperation = sign ? 'source-over' : 'destination-out'
  target.fillStyle = '#fff'
  const step = Math.max(1, r / 3)
  for (let i = 0; i < path.length; i++) {
    const p = path[i]
    if (i > 0) {
      const q = path[i - 1], d = Math.hypot(p[0] - q[0], p[1] - q[1])
      for (let s = step; s < d; s += step) {
        target.beginPath()
        target.arc(q[0] + (p[0] - q[0]) * s / d, q[1] + (p[1] - q[1]) * s / d, r, 0, 7)
        target.fill()
      }
    }
    target.beginPath(); target.arc(p[0], p[1], r, 0, 7); target.fill()
  }
  target.restore()
}
/** Smear stroke -> simplified outer contour at full world res (work at /2 for speed). */
function smearToContour(path, r) {
  const S = 2
  const w = Math.ceil(state.doc.canvas.width / S), h = Math.ceil(state.doc.canvas.height / S)
  raster.width = w; raster.height = h
  rctx.setTransform(1 / S, 0, 0, 1 / S, 0, 0)
  rctx.clearRect(0, 0, w, h)
  stampStroke(path, r / S, 1, rctx, w, h)
  rctx.setTransform(1, 0, 0, 1, 0, 0)
  const img = rctx.getImageData(0, 0, w, h)
  const a = new Uint8Array(w * h)
  for (let i = 0; i < a.length; i++) a[i] = img.data[i * 4 + 3]
  const loop = extractOuterContour(a, w, h)
  if (!loop) return null
  const scaled = loop.map(p => [p[0] * S, p[1] * S])
  return smoothClosed(simplify(scaled, 2.5))
}

/* ---------- document ops ---------- */
function snapshot() {
  state.undoStack.push(JSON.stringify({ o: state.doc.objects, p: state.doc.palette }))
  if (state.undoStack.length > 60) state.undoStack.shift()
  state.redoStack.length = 0
}
function restore(json) {
  const d = JSON.parse(json)
  state.doc.objects = d.o; state.doc.palette = d.p
  state.sel = null; refreshObjectCard(); renderAll()
}
function undo() { if (state.undoStack.length) { state.redoStack.push(JSON.stringify({ o: state.doc.objects, p: state.doc.palette })); restore(state.undoStack.pop()) } }
function redo() { if (state.redoStack.length) { state.undoStack.push(JSON.stringify({ o: state.doc.objects, p: state.doc.palette })); restore(state.redoStack.pop()) } }

function layerKind(id) { return LAYERS.find(l => l.id === id).kind }

function addFace(pts, layer, name) {
  snapshot()
  const o = { id: nid('f'), type: 'face', layer, name: name || `${LAYERS.find(l => l.id === layer).label}${seq}`, color: state.tool.color, pts }
  state.doc.objects.push(o)
  selectObj(o)
  renderAll()
}
function addLine(pts, layer, attachS, attachE) {
  snapshot()
  const w = Math.max(2, state.tool.r)
  const o = { id: nid('l'), type: 'line', layer, name: `${LAYERS.find(l => l.id === layer).label}${seq}`, color: state.tool.color,
    pts, widths: pts.map(() => w), attachStart: attachS, attachEnd: attachE }
  state.doc.objects.push(o)
  selectObj(o)
  renderAll()
}
function addMark(p, layer) {
  snapshot()
  const o = { id: nid('m'), type: 'mark', layer, name: `地标${seq}`, color: state.tool.color, pos: p }
  state.doc.objects.push(o)
  selectObj(o)
  renderAll()
}

/* ---------- attachments: resolve line endpoints that ride on another skeleton ---------- */
function linePointAt(o, t) {  // t in [0,1] along arc length
  const pts = o.pts
  let total = 0
  const seg = []
  for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); total += d }
  let target = t * total
  for (let i = 0; i < seg.length; i++) {
    if (target <= seg[i] || i === seg.length - 1) {
      const k = seg[i] === 0 ? 0 : target / seg[i]

    addPaint: '对选中面加一块（先选中面）',
    subPaint: '对选中面减一块（先选中面）',
  }[m] || '')
  renderDraft()
}
function setHint(s) { hint.textContent = s }
setHint('点选对象 · 拖边界=软拉伸')

document.getElementById('brushR').oninput = e => {
  state.tool.r = +e.target.value
  document.getElementById('brushRVal').textContent = e.target.value
}
document.getElementById('gridBtn').onclick = e => { gridOn = !gridOn; e.target.classList.toggle('on', gridOn); renderGrid() }
document.getElementById('disputeBtn').onclick = e => { disputeOn = !disputeOn; e.target.classList.toggle('on', disputeOn); renderObjects() }
document.getElementById('undoBtn').onclick = undo
document.getElementById('redoBtn').onclick = redo

/* object card */
const objCard = document.getElementById('objCard')
const objName = document.getElementById('objName')
const objColor = document.getElementById('objColor')
const objInfo = document.getElementById('objInfo')
const widthRow = document.getElementById('widthRow')
function selectObj(o) { state.sel = o; refreshObjectCard(); renderObjects() }
function refreshObjectCard() {
  const o = state.sel
  objCard.hidden = !o
  if (!o) return
  objName.value = o.name
  objColor.value = o.color
  widthRow.hidden = o.type !== 'line'
  if (o.type === 'line') document.getElementById('objWidth').value = Math.round(o.widths.reduce((a, b) => a + b, 0) / o.widths.length)
  objInfo.textContent = o.type === 'face'
    ? `${o.pts.length}点 · ${Math.round(Math.abs(polyArea(o.pts))).toLocaleString()}px²`
    : o.type === 'line' ? `${o.pts.length}节点` : '地标'
}
document.getElementById('objRename').onclick = () => {
  if (!state.sel) return
  snapshot()
  state.sel.name = objName.value || state.sel.name
  state.sel.color = objColor.value
  renderAll()
}
objColor.onchange = () => { if (state.sel) { snapshot(); state.sel.color = objColor.value; renderAll() } }
document.getElementById('objWidth').oninput = e => {
  if (!state.sel || state.sel.type !== 'line') return
  state.sel.widths = state.sel.widths.map(() => +e.target.value)
  renderObjects()
}
document.getElementById('objDel').onclick = () => {
  if (!state.sel) return
  snapshot()
  state.doc.objects = state.doc.objects.filter(o => o !== state.sel)
  selectObj(null)
}

/* palette */
const palBox = document.getElementById('palette')
function renderPalette() {
  palBox.innerHTML = ''
  for (const p of state.doc.palette) {
    const d = document.createElement('div')
    d.className = 'sw' + (state.tool.palColor === p.color ? ' on' : '')
    d.style.background = p.color
    d.title = `${p.name} — ${p.desc}`
    d.onclick = () => { state.tool.palColor = p.color; renderPalette() }
    palBox.appendChild(d)
  }
}
renderPalette()
document.getElementById('palAdd').onclick = () => {
  const name = document.getElementById('palName').value.trim()
  const desc = document.getElementById('palDesc').value.trim()
  const color = document.getElementById('palColor').value
  if (!name || !desc) { setHint('自定义语义色需要名称和一句描述，否则 AI 无法理解它'); return }
  state.doc.palette.push({ name, desc, color })
  state.tool.palColor = color
  renderPalette()
}

/* base image: upload + draft promotion */
document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click()
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0]
  if (!f) return
  const img = new Image()
  img.onload = () => {
    baseBmp.width = img.naturalWidth; baseBmp.height = img.naturalHeight
    baseCtx.clearRect(0, 0, baseBmp.width, baseBmp.height)
    baseCtx.drawImage(img, 0, 0)
    state.doc.canvas = { width: baseBmp.width, height: baseBmp.height }
    fitView(); renderAll()
  }
  img.src = URL.createObjectURL(f)
}
document.getElementById('draftToBase').onclick = () => {
  // Prototype hook: real flow sends the semantic-color draft to img2img and
  // swaps in the provider PNG. Here the draft itself becomes the base.
  baseBmp.width = draftBmp.width; baseBmp.height = draftBmp.height
  baseCtx.clearRect(0, 0, baseBmp.width, baseBmp.height)
  baseCtx.drawImage(draftBmp, 0, 0)
  state.doc.canvas = { width: baseBmp.width, height: baseBmp.height }
  renderAll()
  setHint('草稿已用作底图（原型未接图生图）')
}

/* ---------- AI read/write: map-scene.json ---------- */
function exportScene() {
  const objs = state.doc.objects.map(o => {
    if (o.type === 'face') {
      const pts = o.pts
      return {
        id: o.id, type: 'face', layer: o.layer, name: o.name, color: o.color,
        outline: pts.map(p => p.map(Math.round)),
        keyPoints: simplify([...pts, pts[0]], Math.max(2, Math.abs(polyArea(pts)) ** .5 * .015)).slice(0, -1).map(p => p.map(Math.round)),
        centroid: polyCentroid(pts).map(Math.round),
        bbox: polyBBox(pts).map(Math.round),
        areaPx: Math.round(Math.abs(polyArea(pts))),
      }
    }
    if (o.type === 'line') {
      const pts = resolvedPts(o)
      return {
        id: o.id, type: 'line', layer: o.layer, name: o.name, color: o.color,
        skeleton: simplify(pts, 3).map(p => p.map(Math.round)),
        width: Math.round(o.widths.reduce((a, b) => a + b, 0) / o.widths.length),
        attachStart: o.attachStart || undefined, attachEnd: o.attachEnd || undefined,
        bbox: polyBBox(pts).map(Math.round),
      }
    }
    return { id: o.id, type: 'mark', layer: o.layer, name: o.name, color: o.color, pos: o.pos.map(Math.round) }
  })
  // derived disputes: pairwise same-layer face overlap, reported by bbox
  const disputes = []
  for (const layer of LAYERS.filter(l => l.kind === 'face')) {
    const faces = objs.filter(o => o.type === 'face' && o.layer === layer.id)
    for (let i = 0; i < faces.length; i++) for (let j = i + 1; j < faces.length; j++) {
      const A = faces[i].bbox, B = faces[j].bbox
      const x0 = Math.max(A[0], B[0]), y0 = Math.max(A[1], B[1]), x1 = Math.min(A[2], B[2]), y1 = Math.min(A[3], B[3])
      if (x1 <= x0 || y1 <= y0) continue
      // cheap confirmation: sample centroids of bbox-intersection grid
      const a = state.doc.objects.find(o => o.id === faces[i].id), b = state.doc.objects.find(o => o.id === faces[j].id)
      let hit = false
      outer: for (let x = x0; x <= x1; x += Math.max(4, (x1 - x0) / 8)) for (let y = y0; y <= y1; y += Math.max(4, (y1 - y0) / 8)) {
        if (inPoly([x, y], a.pts) && inPoly([x, y], b.pts)) { hit = true; break outer }
      }
      if (hit) disputes.push({ a: faces[i].id, b: faces[j].id, layer: layer.id, bbox: [x0, y0, x1, y1] })
    }
  }
  return {
    version: 1,
    canvas: state.doc.canvas,
    coordinateUnit: 'base-image pixels, origin top-left',
    objects: objs,
    disputes,
    palette: state.doc.palette,
  }
}
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(exportScene(), null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = 'map-scene.json'; a.click()
}
document.getElementById('copyBtn').onclick = () => {
  document.getElementById('aiBox').value = JSON.stringify(exportScene(), null, 2)
  navigator.clipboard.writeText(document.getElementById('aiBox').value)
  setHint('已复制到剪贴板，也填进了文本框')
}
document.getElementById('importBtn').onclick = () => {
  try {
    const doc = JSON.parse(document.getElementById('aiBox').value)
    applyAiOps(doc)
    setHint('导入完成；结果已叠回图上，可继续拉伸')
  } catch (err) { setHint(`导入失败: ${err.message}`) }
}
/** Model output: {ops:[{op:'upsert',object:{id?,type,layer,name?,points/path/pos,width?}}]} or a whole scene doc. */
function applyAiOps(doc) {
  const ops = doc.ops || (doc.objects ? doc.objects.map(o => ({ op: 'upsert', object: o })) : [])
  if (!ops.length) throw new Error('没有可应用的 ops')
  snapshot()
  for (const { object: m } of ops) {
    if (!m || !m.type || !m.layer) continue
    const layer = LAYERS.find(l => l.id === m.layer)
    if (!layer) continue
    const old = m.id ? state.doc.objects.find(o => o.id === m.id) : null
    if (m.type === 'face') {
      const pts = (m.outline || m.points || []).map(p => [+p[0], +p[1]])
      if (pts.length < 3) continue
      const resampled = smoothClosed(maintain(pts, true, 14, 1.6))
      if (old) { old.pts = resampled; if (m.name) old.name = m.name }
      else state.doc.objects.push({ id: m.id || nid('f'), type: 'face', layer: layer.id, name: m.name || 'AI区域', color: m.color || state.tool.color, pts: resampled })
    } else if (m.type === 'line') {
      const pts = (m.skeleton || m.points || m.path || []).map(p => [+p[0], +p[1]])
      if (pts.length < 2) continue
      const dense = maintain(pts, false, 14, 1.6)
      const w = m.width || state.tool.r
      if (old) { old.pts = dense; old.widths = dense.map(() => w); if (m.name) old.name = m.name }
      else state.doc.objects.push({ id: m.id || nid('l'), type: 'line', layer: layer.id, name: m.name || 'AI线', color: m.color || state.tool.color, pts: dense, widths: dense.map(() => w), attachStart: null, attachEnd: null })
    } else if (m.type === 'mark' && m.pos) {
      if (old) { old.pos = [+m.pos[0], +m.pos[1]]; if (m.name) old.name = m.name }
      else state.doc.objects.push({ id: m.id || nid('m'), type: 'mark', layer: layer.id, name: m.name || 'AI地标', color: m.color || state.tool.color, pos: [+m.pos[0], +m.pos[1]] })
    }
  }
  renderAll()
}

/* ---------- procedural placeholder base (works offline, no upload needed) ---------- */
function paintPlaceholderBase() {
  const c = baseCtx
  const g = c.createLinearGradient(0, 0, W0, H0)
  g.addColorStop(0, '#cdb98a'); g.addColorStop(1, '#b39c6d')
  c.fillStyle = g; c.fillRect(0, 0, W0, H0)
  // parchment noise
  for (let i = 0; i < 2600; i++) {
    c.fillStyle = `rgba(${90 + Math.random() * 60},${70 + Math.random() * 50},40,${Math.random() * .05})`
    c.beginPath(); c.arc(Math.random() * W0, Math.random() * H0, Math.random() * 40, 0, 7); c.fill()
  }
  // a couple of soft landmasses so faces have something to cling to
  const blob = (cx, cy, r, n, col) => {
    c.fillStyle = col
    c.beginPath()
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2
      const rr = r * (1 + .28 * Math.sin(a * 3 + cx) + .18 * Math.sin(a * 7 + cy))
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * .72
      i ? c.lineTo(x, y) : c.moveTo(x, y)
    }
    c.closePath(); c.fill()
    c.strokeStyle = 'rgba(60,45,20,.5)'; c.lineWidth = 3; c.stroke()
  }
  blob(480, 430, 300, 60, 'rgba(122,143,86,.55)')
  blob(1130, 600, 260, 60, 'rgba(122,143,86,.45)')
  c.fillStyle = 'rgba(80,110,140,.35)'
  c.fillRect(0, 760, W0, H0 - 760)
}
function fitView() {
  const z = Math.min(stage.clientWidth / state.doc.canvas.width, stage.clientHeight / state.doc.canvas.height) * .96
  state.view.zoom = z
  state.view.panX = (stage.clientWidth - state.doc.canvas.width * z) / 2
  state.view.panY = (stage.clientHeight - state.doc.canvas.height * z) / 2
}

/* ---------- boot ---------- */
paintPlaceholderBase()
fitCanvases()
fitView()
renderAll()
</script>
</body>
