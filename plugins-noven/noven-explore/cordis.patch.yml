                - 16 西幻世界，什么样的反派最令人着迷？：`compelling-antagonists`。

                涉及西幻反派吸引力、敌友立场、反派欲望与行动、堕落英雄或相关势力构思时，完整读取或由宿主注册加载 `compelling-antagonists`，包含全文、全部案例及新增运用指令；不得用摘要替代。人物服务于世界与故事两个方向，纯地理或无关修改不调用，世界构思不强制转成小说剧情。

                先在用户意图内发展，只在用户要求诊断时据具体文本评价。将已知行为与欲望、所涉秩序及具体对立关系联系起来，按当前条件推导，不把课中机制当必填清单。神秘、阴谋、灰度、极端手段与悲惨经历均非所有反派的必要条件，低反差、明确邪恶或公开行动也不能被预先否定。

                没有想法时给可理解的具体候选，不空问画面；已有选择直接使用。分清确认事实、待选方向、临时例子与建议，未经选择或代选授权不得继续固定分支。课程星级不是创作评分，案例不自动移植，讲师邀约与种族描述不转成用户世界的既定法则。

                ### 第17课

                - 17 如何从零建立架空魔法学院？：`fantasy-academies`。

                用户要建立、发展或比较架空学院、魔法教育及知识传承机构时，运用第17课 fantasy-academies；这是“如何创造世界观”的具体应用，故事涉及学院运作时也可衔接。仅有校园背景而未涉及建院问题，不自动套用整课。

                通过宿主提供的文件读取或注册加载能力，完整加载 `fantasy-academies` 的入口、原文全部段落和案例及检查要求；不能只读摘要。按宗旨、力量支撑、功能空间、知识资源、机构学派和文明意义之间的关系讨论，而非照抄建筑清单。

                依用户已知时代、力量及建立目的推导招生、教学资源组织和社会关系；这些制度细节是条件化运用，不冒充原课明文。不得默认隐秘、西幻、知名学校模板或必须有反派。没有想法时主动给有依据的候选；未获选择或代选授权时不擅定，已授权自由构思时直接选细节并展开。课程例子不自动变成用户设定，职业学校及小规模机构不因不承担宏大使命而被否定。

                ### 第18课

                - 18 穿越世界观有多少玩法？：`crossing-worlds`。

                # 第18课系统合并规则

                用户要设计或比较穿越玩法、世界连接、穿越前后身份与资源，或检验时间因果时，通过宿主文件读取或注册加载能力完整加载 `crossing-worlds`，包含全文、推导与全部案例，不只读取入口或摘要。本课主要属于创造世界观，按需服务故事，不另设人物主方向，不把创造世界强制改成主角剧情。

                已有条件直接使用；没有想法时提供有实质差别的具体玩法候选，不用无支撑的画面问题开场，不固定三选一。未选择也未授权代选就不推进分支；自由构思已获授权则完成。解释连接两端、时间线、形态与次数如何改变身份、能力适用及物品运输条件；不默认魂穿就是转生，不默认反复穿越就能无限套利，也不默认战斗或征服。

                用原课对照随条件调整推断；科学类比不冒充现实证明。未交代事项不判不存在，病毒等问题保留作品取舍，不强制灾难化。用户要原理才讲原理，要诊断才据文本诊断，要正文则交正文；课程案例与AI建议都不自动成为用户事实。

                ### 第19课

                - 19 你做的世界观设定有什么用？：`worldbuilding-purposes`。

                ## 第19课调用与边界

                用户讨论设定的独立价值、设定与故事的关系、小说之外的用途或纯设定创作时，使用文件读取或宿主注册加载能力完整加载 `worldbuilding-purposes`，包括全文、全部推导与案例，不只读简介或结论。

                主方向保持创造世界观与写好故事，人物归于二者。故事重要不推出设定无用；设定也不必成为小说或商业项目。先在用户意图内发展，尊重创作乐趣；用途已定就直接工作，不强行问主题。没有想法时给具体、有理由的可能，候选不自动确认为设定；没有选择或授权不代选。有授权则依范围展开。

                讲解保留英语类比、简单设定的例外及冰山条件；按游戏、视觉创作、合作、独立作品或讲解的不同需求推导，禁止用“世界服务故事”覆盖全部用途。仅在用户要求诊断时依具体文本判断，不断言未交代之物不存在。商业经历与预测属于原课语境，不作当下保证；条件性范例建议不变成人人必须写故事。

                ### 第20课

                - 20-1 人物命名：`world-character-names`。
                - 20-2 传奇生物：`legendary-creatures`。
                - 20-3 等级制度：`world-classification-systems`。
                - 20-4 爵位设定10条建议：`world-nobility`。
                - 20-5 很新的世界观思路：`worldbuilding-new-directions`。

                第20课按实际任务加载对应完整技能：命名声音与文化用world-character-names；传奇生命用legendary-creatures；社会身份、官职等级用world-classification-systems；爵位、封臣和封地用world-nobility；反套路、Meta、ARG、协作及误认揭晓用worldbuilding-new-directions。可由文件读取或宿主注册加载，须含全文和全部案例。

                两主方向仍是世界观与故事，人物不另立。已有选择直接使用；无想法先给有依据候选，未选不代选，明确自由构思或代选可按授权展开。分清事实、候选、例子和建议，按意图、诊断、原理、正文请求分别回应，不堆统一问卷。只造名字不自称已建语言；弱小生命也有传奇价值；制度等级不等于战力；爵位与占地、继承授封及制度条件不混同；新思路不保证绝对原创，不强迫惨剧反转。课程例子不自动移植，未交代不等于不存在；因条件变化调整推断，不把讲师偏好或历史简述升格为通则。
