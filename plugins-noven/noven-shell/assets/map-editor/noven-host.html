<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诺文 · 地图编辑器</title>
  <style>
    :root {
      --ink: #242923;
      --muted: #7A7F75;
      --line: #D9D2C0;
      --accent: #0E9F6E;
      --accent-soft: #DDF3E9;
      --ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html, body { height: 100%; margin: 0; background: #EFE6D0; overflow: hidden; }
    iframe { display: block; position: absolute; left: 0; top: 54px; width: 100%; height: calc(100% - 54px); border: 0; }
    #noven-bar {
      position: fixed; left: 0; right: 0; top: 0; height: 54px; z-index: 30;
      display: flex; align-items: center; gap: 20px; padding: 0 22px;
      background: rgba(251, 250, 246, .94); border-bottom: 1px solid #E8E3D7;
      backdrop-filter: blur(14px); font-family: var(--ui);
    }
    #noven-stage { display: flex; align-items: center; gap: 8px; min-width: 190px; }
    .noven-stage-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    #noven-stage-name { color: var(--ink); font-size: 13px; font-weight: 650; }
    .noven-stage-sep { color: #C9CDC3; font-size: 11px; }
    #noven-stage-sub { color: var(--muted); font-size: 11.5px; }
    #noven-steps {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; color: #A7ACA2;
      font-size: 11px; letter-spacing: .06em;
    }
    #noven-steps i { display: block; width: 16px; height: 1px; background: #E8E3D7; }
    #noven-steps span { position: relative; padding-bottom: 4px; }
    #noven-steps span.active { color: var(--ink); font-weight: 600; }
    #noven-steps span.active::after {
      content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px;
      margin-left: -2px; border-radius: 50%; background: var(--accent);
    }
    #noven-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    #noven-primary {
      height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 15px;
      border: 0; border-radius: 9px; background: var(--accent); color: #fff;
      font: 600 11.5px/1 var(--ui); letter-spacing: .02em; cursor: pointer;
      box-shadow: 0 3px 10px rgba(14,159,110,.20);
      transition: background 150ms, transform 150ms, box-shadow 150ms;
    }
    #noven-primary:hover { background: #0B7A55; box-shadow: 0 5px 14px rgba(14,159,110,.24); }
    #noven-primary:active { transform: translateY(1px); }
    #noven-primary:disabled { opacity: .42; cursor: default; box-shadow: none; }
    #noven-primary svg { width: 13px; height: 13px; }
    .noven-icon {
      width: 30px; height: 30px; display: inline-grid; place-items: center;
      border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
      transition: background 150ms, color 150ms;
    }
    .noven-icon:hover, .noven-icon.active { background: var(--accent-soft); color: #0B7A55; }
    .noven-icon svg { width: 16px; height: 16px; }
    #noven-more-menu {
      position: absolute; right: 14px; top: 49px; min-width: 178px; padding: 6px;
      border: 1px solid #E8E3D7; border-radius: 11px; background: rgba(251,250,246,.98);
      box-shadow: 0 18px 44px rgba(36,41,35,.16); z-index: 40;
    }
    #noven-more-menu[hidden] { display: none; }
    #noven-more-menu button {
      width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 9px;
      border: 0; border-radius: 7px; background: transparent; color: var(--ink);
      font: 11.5px/1 var(--ui); text-align: left; cursor: pointer;
    }
    #noven-more-menu button:hover { background: #F4F1E8; }
    #noven-more-menu button:disabled { opacity: .45; cursor: default; }
    #noven-more-menu span { flex: 1; }
    #noven-more-menu small { color: #A7ACA2; font-size: 9.5px; }
    #noven-more-menu hr { border: 0; border-top: 1px solid #EFEBE1; margin: 5px 4px; }
    #noven-finalize, #noven-human, #noven-state { display: none !important; }
    @media (max-width: 960px) {
      #noven-steps { display: none; }
      #noven-stage { min-width: 150px; }
    }
    @media (max-width: 720px) {
      #noven-bar { padding: 0 10px; gap: 8px; }
      #noven-stage { display: none; }
      #noven-primary { padding: 0 10px; }
    }
    #noven-ai-log {
      position: fixed; left: 14px; bottom: 58px; z-index: 40;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 9px; border: 1px solid rgba(14,159,110,.25); border-radius: 9px;
      background: rgba(228,245,237,.97); color: #0B7A55; font: 11px var(--ui);
      box-shadow: 0 4px 16px rgba(20,30,26,.08);
    }
    #noven-ai-log[hidden] { display: none; }
    #noven-ai-log button {
      height: 24px; padding: 0 8px; border: 1px solid #0E9F6E; border-radius: 6px;
      background: #0E9F6E; color: #fff; font: 10px var(--ui); cursor: pointer;
    }
  </style>
  <style>
    :root {
      --n-ink: #24261F;
      --n-muted: #6F7468;
      --n-faint: #9B9F93;
      --n-paper: #FCF9F0;
      --n-desk: #F6F1E6;
      --n-line: #E3DAC7;
      --n-sand: #EDE7DA;
      --n-accent: #0E7A55;
      --n-accent-deep: #0A5E42;
    }
    iframe#fmg { top: 0 !important; height: 100% !important; }
    #noven-bar, #noven-ai-log, #noven-edge-tab { display: none !important; }
    #noven-shell { font-family: var(--ui); color: var(--n-ink); }
    #noven-rail {
      position: fixed; left: 14px; top: 50%; transform: translateY(-50%); z-index: 60;
      width: 58px; padding: 6px; display: flex; flex-direction: column; gap: 3px;
      background: rgba(252, 249, 240, .94); border: 1px solid var(--n-line);
      border-radius: 17px; box-shadow: 0 14px 40px rgba(36, 38, 31, .13);
      backdrop-filter: blur(16px);
    }
    #noven-rail button {
      position: relative;
      width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; border: 0; border-radius: 10px; background: transparent;
      color: var(--n-muted); font: 9.5px/1 var(--ui); cursor: pointer;
      transition: background 140ms, color 140ms;
    }
    #noven-rail button svg { width: 18px; height: 18px; display: block; }
    #noven-rail button:hover { background: var(--n-sand); color: var(--n-ink); }
    #noven-rail button.active { background: var(--n-sand); color: var(--n-ink); }
    #noven-rail button:disabled { opacity: .32; cursor: default; }
    #noven-rail .rail-sep { height: 1px; margin: 4px 7px; background: var(--n-line); }
    #noven-rail .rail-dot {
      position: absolute; right: 7px; top: 7px; width: 5px; height: 5px;
      border-radius: 50%; background: var(--n-accent); box-shadow: 0 0 0 3px rgba(14, 122, 85, .14);
    }
    #noven-rail .rail-dot[hidden] { display: none; }

    .noven-panel {
      position: fixed; left: 84px; top: 16px; bottom: 92px; z-index: 55; width: 304px;
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(252, 249, 240, .97); border: 1px solid var(--n-line);
      border-radius: 16px; box-shadow: 0 20px 54px rgba(36, 38, 31, .14);
      backdrop-filter: blur(18px);
    }
    .noven-panel[hidden] { display: none; }
    .noven-panel-right { left: auto; right: 16px; width: 322px; }
    .noven-panel-head {
      height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 6px;
      padding: 0 10px 0 16px; border-bottom: 1px solid var(--n-line);
    }
    .noven-panel-head strong {
      flex: 1; font: 600 15px/1 var(--serif, "Songti SC", serif); letter-spacing: .03em;
    }
    .noven-icon-btn {
      width: 28px; height: 28px; display: inline-grid; place-items: center;
      border: 0; border-radius: 7px; background: transparent; color: var(--n-faint);
      font: 14px/1 var(--ui); cursor: pointer;
    }
    .noven-icon-btn:hover { background: var(--n-sand); color: var(--n-ink); }
    .noven-text-btn {
      height: 26px; padding: 0 8px; border: 1px solid var(--n-line); border-radius: 7px;
      background: #fff; color: var(--n-muted); font: 10.5px/1 var(--ui); cursor: pointer;
    }
    .noven-text-btn:hover { background: var(--n-sand); color: var(--n-ink); }
    .noven-panel-body { flex: 1; min-height: 0; overflow: auto; }
    .noven-search { padding: 12px 14px 6px; }
    .noven-search input {
      width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px;
      border: 1px solid var(--n-line); border-radius: 8px; background: #fff;
      color: var(--n-ink); font: 11.5px var(--ui); outline: none;
    }
    .noven-search input:focus { border-color: #BEB29A; }
    .noven-group { border-bottom: 1px solid var(--n-line); }
    .noven-group:last-child { border-bottom: 0; }
    .noven-group-head {
      width: 100%; height: 40px; display: flex; align-items: center; gap: 8px;
      padding: 0 14px; border: 0; background: transparent; color: var(--n-ink);
      font: 12px/1 var(--ui); text-align: left; cursor: pointer;
    }
    .noven-group-head:hover { background: rgba(237, 231, 218, .55); }
    .noven-group-head .noven-chev {
      width: 12px; height: 12px; color: var(--n-faint); transition: transform 180ms var(--n-ease, ease);
    }
    .noven-group.open .noven-chev { transform: rotate(90deg); }
    .noven-group-head .noven-count { margin-left: auto; color: var(--n-faint); font-size: 10px; }
    .noven-rows { padding: 0 8px 8px; }
    .noven-group:not(.open) .noven-rows { display: none; }
    .noven-row {
      width: 100%; height: 34px; display: flex; align-items: center; gap: 8px;
      padding: 0 8px; border: 0; border-radius: 7px; background: transparent;
      color: var(--n-ink); font: 11.5px/1 var(--ui); text-align: left; cursor: pointer;
    }
    .noven-row:hover { background: var(--n-sand); }
    .noven-row .noven-row-note {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--n-faint); font-size: 9.5px;
    }
    .noven-row .noven-count { margin-left: auto; color: var(--n-faint); font-size: 10px; }
    .noven-row .noven-go { color: #C0B7A4; font-size: 12px; }
    .noven-empty { padding: 18px 14px; color: var(--n-faint); font: 11px/1.6 var(--ui); }

    #noven-dock {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60;
      height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
      background: rgba(252, 249, 240, .94); border: 1px solid var(--n-line);
      border-radius: 15px; box-shadow: 0 12px 34px rgba(36, 38, 31, .13);
      backdrop-filter: blur(16px);
    }
    #noven-dock-left, #noven-dock-right { display: flex; align-items: center; gap: 2px; }
    #noven-dock-left button, #noven-dock-right .noven-icon-btn {
      width: 28px; height: 28px; display: inline-grid; place-items: center;
      border: 0; border-radius: 7px; background: transparent; color: var(--n-muted);
      cursor: pointer;
    }
    #noven-dock-left button:hover, #noven-dock-right .noven-icon-btn:hover { background: var(--n-sand); color: var(--n-ink); }
    #noven-dock-left button:disabled { opacity: .28; cursor: default; }
    #noven-dock-left svg, #noven-dock-right svg { width: 15px; height: 15px; }
    #noven-dock-stage {
      min-width: 142px; display: flex; flex-direction: column; align-items: flex-start;
      gap: 2px; padding: 0 8px; border-left: 1px solid var(--n-line);
      border-right: 1px solid var(--n-line);
    }
    #noven-dock-stage-name { font: 600 12px/1.2 var(--ui); }
    #noven-dock-stage-counts { color: var(--n-faint); font: 9.5px/1.2 var(--ui); }
    #noven-dock-steps { display: flex; align-items: center; gap: 5px; color: var(--n-faint); font: 8.5px/1 var(--ui); }
    #noven-dock-steps i { width: 8px; height: 1px; background: var(--n-line); display: block; }
    #noven-dock-steps span.active { color: var(--n-ink); font-weight: 600; }
    #noven-dock-primary {
      height: 32px; padding: 0 14px; border: 0; border-radius: 8px;
      background: var(--n-accent); color: #fff; font: 600 11px/1 var(--ui);
      letter-spacing: .02em; cursor: pointer; white-space: nowrap;
    }
    #noven-dock-primary:hover { background: var(--n-accent-deep); }
    #noven-dock-primary:disabled { opacity: .38; cursor: default; }
    #noven-dock-primary svg { width: 12px; height: 12px; margin-left: 5px; vertical-align: -1px; }

    #noven-tools-menu {
      position: fixed; left: 84px; bottom: 92px; z-index: 65; width: 200px; padding: 6px;
      background: rgba(252, 249, 240, .98); border: 1px solid var(--n-line);
      border-radius: 12px; box-shadow: 0 18px 48px rgba(36, 38, 31, .17);
    }
    #noven-tools-menu[hidden] { display: none; }
    #noven-tools-menu button {
      width: 100%; height: 32px; display: flex; align-items: center; padding: 0 9px;
      border: 0; border-radius: 7px; background: transparent; color: var(--n-ink);
      font: 11.5px/1 var(--ui); text-align: left; cursor: pointer;
    }
    #noven-tools-menu button:hover { background: var(--n-sand); }
    #noven-tools-menu hr { border: 0; border-top: 1px solid var(--n-line); margin: 5px 4px; }

    #noven-gen {
      position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
      background: rgba(30, 32, 27, .22); backdrop-filter: blur(3px);
    }
    #noven-gen[hidden] { display: none; }
    .noven-gen-card {
      width: min(540px, calc(100vw - 32px)); max-height: min(760px, calc(100vh - 40px));
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--n-paper); border: 1px solid var(--n-line);
      border-radius: 18px; box-shadow: 0 30px 90px rgba(30, 32, 27, .24);
    }
    .noven-gen-head {
      height: 54px; flex: 0 0 54px; display: flex; align-items: center; gap: 8px;
      padding: 0 14px 0 18px; border-bottom: 1px solid var(--n-line);
    }
    .noven-gen-head strong { flex: 1; font: 600 16px/1 var(--serif, "Songti SC", serif); }
    .noven-gen-body { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
    .noven-gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .noven-gen-grid label { display: flex; flex-direction: column; gap: 5px; color: var(--n-muted); font: 10.5px var(--ui); }
    .noven-gen-grid input {
      height: 32px; padding: 0 9px; border: 1px solid var(--n-line); border-radius: 8px;
      background: #fff; color: var(--n-ink); font: 12px var(--ui); outline: none;
    }
    .noven-gen-note { margin: 14px 0 0; color: var(--n-faint); font: 10px/1.6 var(--ui); }
    .noven-rebuild-title { margin: 20px 0 8px; color: var(--n-faint); font: 600 9.5px var(--ui); letter-spacing: .14em; }
    .noven-rebuild { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .noven-rebuild button {
      height: 30px; border: 1px solid var(--n-line); border-radius: 7px; background: #fff;
      color: var(--n-ink); font: 10.5px var(--ui); cursor: pointer; text-align: left; padding: 0 8px;
    }
    .noven-rebuild button:hover { background: var(--n-sand); }
    .noven-rebuild button:disabled { opacity: .38; cursor: default; }
    .noven-rebuild button:disabled:hover { background: #fff; }
    .noven-gen-foot {
      flex: 0 0 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding: 0 16px; border-top: 1px solid var(--n-line);
    }
    .noven-gen-foot button {
      height: 32px; padding: 0 14px; border: 1px solid var(--n-line); border-radius: 8px;
      background: transparent; color: var(--n-muted); font: 11.5px var(--ui); cursor: pointer;
    }
    .noven-gen-foot button.primary { border-color: var(--n-accent); background: var(--n-accent); color: #fff; font-weight: 600; }
    .noven-gen-foot button.primary:hover { background: var(--n-accent-deep); }

    .noven-layer-row {
      height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
      border-radius: 6px; color: var(--n-ink); font: 11px var(--ui);
    }
    .noven-layer-row:hover { background: var(--n-sand); }
    .noven-layer-row .noven-eye {
      width: 24px; height: 24px; display: grid; place-items: center; border: 0;
      border-radius: 6px; background: transparent; color: var(--n-muted); cursor: pointer;
    }
    .noven-layer-row .noven-eye svg { width: 15px; height: 15px; }
    .noven-layer-row.off .noven-eye { color: var(--n-faint); }
    .noven-layer-row.off { color: var(--n-faint); }
    .noven-layer-row .noven-layer-name { flex: 1; }
    .noven-layer-row .noven-gear { color: var(--n-faint); }
    .noven-layer-presets { padding: 12px 14px 6px; }
    .noven-layer-presets select {
      width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--n-line);
      border-radius: 8px; background: #fff; color: var(--n-ink); font: 11.5px var(--ui);
    }
    .noven-layer-view { display: flex; gap: 4px; padding: 8px 14px 4px; }
    .noven-layer-view button {
      flex: 1; height: 28px; border: 1px solid var(--n-line); border-radius: 7px;
      background: #fff; color: var(--n-muted); font: 10.5px var(--ui); cursor: pointer;
    }
    .noven-layer-view button:hover { border-color: #BEB29A; color: var(--n-ink); }
    .noven-layer-view button.active { background: var(--n-sand); border-color: #D3C7B0; color: var(--n-ink); }
    .noven-layer-group { padding: 4px 8px 8px; }
    .noven-layer-group.open .noven-chev { transform: rotate(90deg); }
    .noven-layer-group h4 { margin: 10px 8px 3px; color: var(--n-faint); font: 600 9px var(--ui); letter-spacing: .14em; }

    .noven-ai-note { padding: 16px; color: var(--n-muted); font: 11.5px/1.7 var(--ui); }
    .noven-ai-status {
      margin: 0 16px; padding: 12px; border: 1px solid var(--n-line);
      border-radius: 10px; background: #fff; color: var(--n-ink); font: 11.5px/1.6 var(--ui);
    }
    .noven-ai-status strong { display: block; margin-bottom: 4px; font-size: 12px; }
    .noven-ai-undo {
      margin: 10px 16px; height: 32px; border: 1px solid var(--n-accent); border-radius: 8px;
      background: var(--n-accent); color: #fff; font: 11px var(--ui); cursor: pointer;
    }
    .noven-ai-undo[hidden] { display: none; }

    #noven-toast {
      position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 70;
      padding: 7px 12px; border: 1px solid var(--n-line); border-radius: 9px;
      background: rgba(252, 249, 240, .96); color: var(--n-ink); font: 11px var(--ui);
      box-shadow: 0 8px 24px rgba(36, 38, 31, .12);
    }
    #noven-toast[hidden] { display: none; }
    #noven-boot {
      position: fixed; inset: 0; z-index: 55; display: grid; place-items: center;
      background: rgba(246, 241, 230, .52); backdrop-filter: blur(2px);
      pointer-events: none;
    }
    #noven-boot[hidden] { display: none; }
    .noven-boot-card {
      pointer-events: auto; width: min(360px, calc(100vw - 40px)); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 20px;
      border: 1px solid var(--n-line); border-radius: 16px; background: var(--n-paper);
      box-shadow: 0 24px 70px rgba(36, 38, 31, .18); text-align: center;
    }
    .noven-boot-card strong { font: 600 16px/1.3 var(--serif, "Songti SC", serif); }
    .noven-boot-card span { color: var(--n-muted); font: 11.5px/1.6 var(--ui); }
    .noven-boot-card button {
      margin-top: 4px; height: 30px; padding: 0 12px; border: 1px solid var(--n-accent);
      border-radius: 8px; background: var(--n-accent); color: #fff; font: 11px var(--ui); cursor: pointer;
    }
    .noven-boot-card button[hidden] { display: none; }

    @media (max-width: 760px) {
      #noven-rail { left: 8px; width: 50px; padding: 4px; }
      #noven-rail button { width: 42px; height: 40px; }
      .noven-panel { left: 66px; top: 8px; bottom: 82px; width: calc(100vw - 74px); }
      .noven-panel-right { left: auto; right: 8px; width: calc(100vw - 74px); }
      #noven-dock { left: 66px; right: 8px; bottom: 8px; transform: none; justify-content: space-between; }
      #noven-dock-stage { min-width: 0; }
      #noven-dock-stage-counts, #noven-dock-steps { display: none; }
      #noven-dock-primary { padding: 0 10px; }
      #noven-tools-menu { left: 66px; bottom: 82px; }
      .noven-gen-grid { grid-template-columns: 1fr; }
      .noven-rebuild { grid-template-columns: 1fr 1fr; }
    }
    @media (max-height: 560px) {
      #noven-rail { top: 8px; transform: none; }
      #noven-rail button { height: 38px; }
      .noven-panel { top: 8px; bottom: 82px; }
    }
  </style>
</head>
<body>
  <iframe id="fmg" src="./?noven=blank&v=2" title="Fantasy Map Generator"></iframe>
  <div id="noven-bar" role="toolbar" aria-label="地图操作">
    <div id="noven-stage">
      <span class="noven-stage-dot"></span>
      <span id="noven-stage-name">白膜</span>
      <span class="noven-stage-sep">·</span>

      ['经济', 'regenerateEconomy'], ['生产', 'regenerateProduction'], ['市场', 'regenerateMarkets'],
      ['冰川', 'regenerateIce'],
    ]

    function toast(message) {
      if (toastEl === null) return
      window.clearTimeout(toastTimer)
      toastEl.textContent = message
      toastEl.hidden = false
      toastTimer = window.setTimeout(() => { toastEl.hidden = true }, 2400)
    }

    function readCounts() {
      const p = frame.contentWindow?.pack
      const live = list => (Array.isArray(list) ? list : []).filter(item => item && item.i !== 0 && !item.removed).length
      return {
        states: live(p?.states),
        provinces: live(p?.provinces),
        cultures: live(p?.cultures),
        religions: live(p?.religions),
        burgs: live(p?.burgs),
        rivers: live(p?.rivers),
        routes: live(p?.routes),
        markers: live(p?.markers),
        zones: live(p?.zones),
        markets: live(p?.markets),
        goods: live(p?.goods),
        features: live(p?.features),
        biomes: (p?.biomes ?? []).filter(biome => biome && biome.i).length,
        lakes: (p?.features ?? []).filter(feature => feature && feature.type === 'lake').length,
        labels: 0,
      }
    }

    function setRail(tool) {
      const entries = { brush: railBrush, world: railWorld, layers: railLayers, ai: railAi }
      for (const [id, button] of Object.entries(entries)) button.classList.toggle('active', id === tool)
    }

    function isBrushOpen() {
      const panel = frame.contentDocument?.getElementById('brushesPanel')
      return Boolean(panel && panel.offsetParent !== null)
    }

    function syncRail() {
      if (isBrushOpen()) setRail('brush')
      else if (!worldPanel.hidden) setRail('world')
      else if (!layerPanel.hidden) setRail('layers')
      else if (!aiPanel.hidden) setRail('ai')
      else setRail(null)
      railBrush.disabled = currentStage !== 'blank'
    }

    function closeBrushDialog() {
      try {
        const jq = frame.contentWindow?.jQuery
        if (typeof jq === 'function') {
          const dialog = jq('#brushesPanel')
          if (dialog.dialog('isOpen')) dialog.dialog('close')
        }
      } catch (error) {
        console.warn('Noven brush close failed', error)
      }
    }

    function closeEditorModals() {
      const doc = frame.contentDocument
      if (doc === null || doc === undefined) return
      const had = doc.body.classList.contains('noven-style-open') || doc.body.classList.contains('noven-options-open')
      doc.body.classList.remove('noven-style-open', 'noven-options-open')
      if (had) {
        try { frame.contentWindow?.hideOptions?.() } catch { /* options may be closed */ }
      }
    }

    function closePanels(except) {
      if (except !== 'style') closeEditorModals()
      if (except !== 'brush') closeBrushDialog()
      if (except !== 'world') worldPanel.hidden = true
      if (except !== 'layers') layerPanel.hidden = true
      if (except !== 'ai') aiPanel.hidden = true
      if (except !== 'more') toolsMenu.hidden = true
      syncRail()
    }

    function openStyleEditor(id) {
      openController('StyleEditor', 'open', id)
      window.setTimeout(() => {
        const doc = frame.contentDocument
        if (doc !== null && doc !== undefined) doc.body.classList.add('noven-style-open')
      }, 120)
    }

    function openOptionsEditor() {
      closePanels()
      const win = frame.contentWindow
      const doc = win?.document
      if (doc === null || doc === undefined) return
      win.showOptions?.()
      doc.getElementById('optionsTab')?.click()
      window.setTimeout(() => {
        doc.body.classList.add('noven-options-open')
      }, 80)
    }

    function openBrushShelf() {
      if (currentStage !== 'blank') {
        toast('地形已定稿；要改高程请用「世界 → 地理 → 高程」')
        return
      }
      closePanels('brush')
      const controller = frame.contentWindow?.Controllers?.HeightmapEditor
      if (!controller?.openBrushes) {
        toast('画笔还没准备好')
        return
      }
      Promise.resolve(controller.openBrushes()).catch(error => {
        console.warn('Noven brush open failed', error)
        toast('画笔没有打开')
      })
      setRail('brush')
    }

    function openWorldShelf() {
      closePanels('world')
      renderWorld()
      worldPanel.hidden = false
      if (window.innerWidth >= 760) worldSearch.focus()
      setRail('world')
    }

    function renderWorld() {
      if (worldBody === null) return
      const counts = readCounts()
      try { counts.labels = frame.contentWindow?.getLabelsData?.()?.length ?? 0 } catch { counts.labels = 0 }
      const query = (worldSearch.value ?? '').trim().toLowerCase()
      const groups = query
        ? WORLD_GROUPS
            .map(group => ({
              ...group,
              rows: group.rows.filter(row => `${row.label}${row.note ?? ''}`.toLowerCase().includes(query)),
            }))
            .filter(group => group.rows.length > 0)
        : WORLD_GROUPS
      worldBody.replaceChildren()
      if (groups.length === 0) {
        const empty = document.createElement('div')
        empty.className = 'noven-empty'
        empty.textContent = `没有找到「${query}」。试试国家、城市、生物群系、图层。`
        worldBody.appendChild(empty)
        return
      }
      for (const group of groups) {
        const open = query !== '' || group.id === worldOpenGroup
        const section = document.createElement('section')
        section.className = `noven-group${open ? ' open' : ''}`
        const head = document.createElement('button')
        head.type = 'button'
        head.className = 'noven-group-head'
        const chevron = document.createElement('span')
        chevron.className = 'noven-chev'
        chevron.textContent = '›'
        const name = document.createElement('span')
        name.textContent = group.label
        head.append(chevron, name)
        if (group.countKey !== undefined) {
          const count = document.createElement('span')
          count.className = 'noven-count'
          count.textContent = `${counts[group.countKey] ?? 0} ${group.unit ?? ''}`
          head.appendChild(count)
        }
        head.addEventListener('click', () => {
          if (query !== '') worldSearch.value = ''
          worldOpenGroup = group.id
          renderWorld()
        })
        section.appendChild(head)
        const rows = document.createElement('div')
        rows.className = 'noven-rows'
        for (const row of group.rows) {
          const button = document.createElement('button')
          button.type = 'button'
          button.className = 'noven-row'
          const label = document.createElement('span')
          label.textContent = row.label
          const note = document.createElement('span')
          note.className = 'noven-row-note'
          note.textContent = row.note ?? ''
          button.append(label, note)
          if (row.countKey !== undefined) {
            const count = document.createElement('span')
            count.className = 'noven-count'
            count.textContent = String(counts[row.countKey] ?? 0)
            button.appendChild(count)
          }
          const go = document.createElement('span')
          go.className = 'noven-go'
          go.textContent = '›'
          button.appendChild(go)
          button.addEventListener('click', () => row.run())
          rows.appendChild(button)
        }
        section.appendChild(rows)
        worldBody.appendChild(section)
      }
    }

    function openLayerPanel() {
      closePanels('layers')
      const hiddenPreset = frame.contentDocument?.getElementById('layersPreset')
      const hiddenValue = hiddenPreset?.value
      const knownValues = [...presetSelect.options].map(option => option.value)
      presetSelect.value = knownValues.includes(hiddenValue) ? hiddenValue : 'political'
      renderLayers()
      syncViewButtons()
      layerPanel.hidden = false
      setRail('layers')
    }

    function syncViewButtons() {
      const doc = frame.contentDocument
      const mapping = { standard: 'viewStandard', mesh: 'viewMesh', globe: 'viewGlobe' }
      for (const button of layerPanel.querySelectorAll('[data-view]')) {
        const id = mapping[button.dataset.view]
        button.classList.toggle('active', doc?.getElementById(id)?.classList.contains('pressed') ?? false)
      }
    }

    function renderLayers() {
      if (layerBody === null) return
      const win = frame.contentWindow
      layerBody.replaceChildren()
      for (const group of LAYER_GROUPS) {
        const open = layerOpenGroups.has(group.id)
        const section = document.createElement('div')
        section.className = `noven-layer-group${open ? ' open' : ''}`
        const head = document.createElement('button')
        head.type = 'button'
        head.className = 'noven-group-head'
        const chevron = document.createElement('span')
        chevron.className = 'noven-chev'
        chevron.textContent = '›'
        const name = document.createElement('span')
        name.textContent = group.label
        head.append(chevron, name)
        head.addEventListener('click', () => {
          if (layerOpenGroups.has(group.id)) layerOpenGroups.delete(group.id)
          else layerOpenGroups.add(group.id)
          renderLayers()
        })
        section.appendChild(head)
        if (!open) {
          layerBody.appendChild(section)
          continue
        }
        for (const [id, label] of group.ids) {
          let on = true
          try { on = win?.Layers?.isOn?.(id) !== false } catch { on = true }
          const row = document.createElement('div')
          row.className = `noven-layer-row${on ? '' : ' off'}`
          const eye = document.createElement('button')
          eye.type = 'button'
          eye.className = 'noven-eye'
          eye.title = on ? '隐藏' : '显示'
          eye.innerHTML = on
            ? '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.8 9s2.6-4.2 7.2-4.2S16.2 9 16.2 9s-2.6 4.2-7.2 4.2S1.8 9 1.8 9Z"/><circle cx="9" cy="9" r="2.1"/></svg>'
            : '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.8 9s2.6-4.2 7.2-4.2S16.2 9 16.2 9s-2.6 4.2-7.2 4.2S1.8 9 1.8 9Z"/><circle cx="9" cy="9" r="2.1"/><path d="m3 15 12-12"/></svg>'
          eye.addEventListener('click', event => {
            event.stopPropagation()
            try { win?.Layers?.toggle?.(id) } catch (error) { console.warn('Noven layer toggle failed', error) }
            renderLayers()
          })
          const labelEl = document.createElement('span')
          labelEl.className = 'noven-layer-name'
          labelEl.textContent = label
          const gear = document.createElement('button')
          gear.type = 'button'
          gear.className = 'noven-icon-btn noven-gear'
          gear.title = '样式'
          gear.textContent = '⚙'
          gear.addEventListener('click', event => {
            event.stopPropagation()
            openStyleEditor(id)
          })
          row.append(eye, labelEl, gear)
          section.appendChild(row)
        }
        layerBody.appendChild(section)
      }
    }

    function refreshAiPanel() {
      if (aiStatusEl === null) return
      const count = undoCount()
      aiStatusEl.replaceChildren()
      const title = document.createElement('strong')
      title.textContent = count > 0 ? `可撤销 ${count} 批 AI 改动` : '暂无 AI 改动'
      const body = document.createElement('span')
      body.textContent = count > 0 ? '最近一批改动已写入地图；撤销会整批回退。' : '地图当前没有被 AI 修改过的批次。'
      aiStatusEl.append(title, body)
      if (aiUndoPanel !== null) aiUndoPanel.hidden = count === 0
      if (railAiDot !== null) railAiDot.hidden = count === 0
    }

    function openAiPanel() {
      closePanels('ai')
      refreshAiPanel()
      aiPanel.hidden = false
      setRail('ai')
    }

    function openMoreMenu() {
      closePanels('more')
      const rect = railMore.getBoundingClientRect()
      toolsMenu.style.left = `${Math.min(rect.right + 8, window.innerWidth - 216)}px`
      toolsMenu.style.top = `${Math.max(8, Math.min(rect.bottom - 232, window.innerHeight - 240))}px`
      toolsMenu.style.bottom = 'auto'
      toolsMenu.hidden = !toolsMenu.hidden
      setRail(null)
    }

    function openAddMenu(anchor) {
      const existing = document.getElementById('noven-add-menu')
      if (existing !== null) existing.remove()
      const menu = document.createElement('div')
      menu.id = 'noven-add-menu'
      Object.assign(menu.style, {
        position: 'fixed', zIndex: '70', minWidth: '150px', padding: '6px',
        background: '#FCF9F0', border: '1px solid #E3DAC7', borderRadius: '10px',
        boxShadow: '0 12px 32px rgba(36, 38, 31, .16)',
      })
      const rect = anchor.getBoundingClientRect()
      menu.style.left = `${Math.min(rect.left, window.innerWidth - 170)}px`
      menu.style.top = `${rect.bottom + 6}px`
      const items = [
        ['城市', () => openController('BurgCreator', 'toggle')],
        ['标签', () => openController('LabelCreator', 'toggle')],
        ['标记', () => openController('MarkerCreator', 'toggle')],
        ['河流', () => openController('RiverAutoCreator', 'toggle')],
        ['道路', () => openController('RouteCreator', 'open')],
      ]
      for (const [label, run] of items) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = label
        Object.assign(button.style, {
          display: 'block', width: '100%', height: '30px', padding: '0 9px',
          border: '0', borderRadius: '7px', background: 'transparent', color: '#24261F',
          font: '11.5px system-ui, sans-serif', textAlign: 'left', cursor: 'pointer',
        })
        button.addEventListener('mouseenter', () => { button.style.background = '#EDE7DA' })
        button.addEventListener('mouseleave', () => { button.style.background = 'transparent' })
        button.addEventListener('click', () => { menu.remove(); run() })
        menu.appendChild(button)
      }
      document.body.appendChild(menu)
      window.setTimeout(() => {
        const close = event => {
          if (!menu.contains(event.target)) menu.remove()
          document.removeEventListener('click', close)
        }
        document.addEventListener('click', close)
      }, 0)
    }

    function openGenerationSheet() {
      if (currentStage === 'blank') {
        toast('先定稿地形，再生成人文层')
        return
      }
      closePanels()
      const counts = readCounts()
      const set = (id, value) => {
        const input = document.getElementById(id)
        if (input !== null) input.value = String(value)
      }
      set('noven-gen-states', counts.states || 20)
      set('noven-gen-provinces', 0.5)
      set('noven-gen-cultures', counts.cultures || 8)
      set('noven-gen-religions', counts.religions || 6)
      set('noven-gen-burgs', counts.burgs || 120)
      genRun.textContent = currentStage === 'world' ? '重新生成人文层' : '生成人文层'
      renderRebuild()
      genSheet.hidden = false
      setRail(null)
    }

    function renderRebuild() {
      if (genRebuild === null) return
      genRebuild.replaceChildren()
      for (const [label, id] of REBUILDS) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = label
        button.disabled = currentStage !== 'world'
        button.addEventListener('click', () => {
          genSheet.hidden = true
          closePanels()
          const target = frame.contentDocument?.getElementById(id)
          if (target === null || target === undefined) {
            toast(`没有找到「${label}」的重建入口`)
            return
          }
          target.click()
          syncDock()
        })
        genRebuild.appendChild(button)
      }
    }

    function openController(name, method = 'open', ...args) {
      const entry = frame.contentWindow?.Controllers?.[name]
      const fn = entry?.[method]
      if (typeof fn !== 'function') {
        toast(`暂时打不开「${name}」`)
        return
      }
      closePanels()
      setRail(null)
      Promise.resolve(fn.apply(entry, args)).catch(error => {
        console.warn(`Noven controller ${name}.${method} failed`, error)
        toast('编辑器没有打开')
      })
    }

    function updateBoot() {
      if (bootEl === null) return
      if (!ready) {
        bootEl.hidden = false
        bootTitle.textContent = '正在连接地图引擎…'
        bootText.textContent = '正在启动地图编辑器。'
        bootAction.hidden = true
        return
      }
      const blank = frame.contentWindow?.novenBlank === true
      const loaded = currentStage !== 'blank' && Boolean(frame.contentWindow?.pack?.cells?.i?.length)
      if (blank || loaded) {
        bootEl.hidden = true
        return
      }
      bootEl.hidden = false
      const timedOut = Date.now() - bootSince > 12000
      bootTitle.textContent = timedOut ? '地图数据还没送达' : '正在准备地图…'
      bootText.textContent = timedOut
        ? '如果这是从卡页打开的地图，请刷新卡页；如果这是独立预览，可以重开白膜。'
        : '正在连接地图引擎并等待地图数据。'
      bootAction.hidden = !timedOut || embedded
    }

    function syncDock() {
      if (dockStageName === null || dockPrimary === null) return
      const stage = currentStage
      const counts = readCounts()
      dockStageName.textContent = stage === 'world' ? '人文' : stage === 'terrain' ? '地形' : '白膜'
      dockStageCounts.textContent = stage === 'world'
        ? `${counts.states} 国 · ${counts.provinces} 省 · ${counts.burgs} 城`
        : stage === 'terrain'
          ? '地形已定稿 · 生成人文层'
          : '先涂地形'
      const label = stage === 'world' ? '保存到卡' : stage === 'terrain' ? '生成人文层' : '定稿地形'
      if (dockPrimary.dataset.label !== label) {
        dockPrimary.dataset.label = label
        dockPrimary.innerHTML = `${label}${DOCK_ARROW}`
      }
      dockPrimary.disabled = stage === 'world'
        ? saveButton.disabled
        : stage === 'terrain'
          ? !ready
          : finalizeButton.disabled || !ready
      for (const step of dockSteps?.querySelectorAll('[data-step]') ?? []) {
        step.classList.toggle('active', step.dataset.step === stage)
      }
      const brushUndo = frame.contentDocument?.getElementById('undo')
      const brushRedo = frame.contentDocument?.getElementById('redo')
      const undoTotal = undoCount()
      if (stage === 'world') {
        dockUndo.disabled = undoTotal === 0
        dockRedo.disabled = true
      } else {
        dockUndo.disabled = brushUndo?.disabled ?? true
        dockRedo.disabled = brushRedo?.disabled ?? true
      }
      if (railAiDot !== null) railAiDot.hidden = undoTotal === 0
      if (railBrush !== null) railBrush.disabled = stage !== 'blank'
      syncRail()
      updateBoot()
    }

    function wireShell() {
      railBrush?.addEventListener('click', () => {
        if (isBrushOpen()) closeBrushDialog()
        else openBrushShelf()
        syncRail()
      })
      railWorld?.addEventListener('click', () => {
        if (!worldPanel.hidden) { worldPanel.hidden = true; syncRail() }
        else openWorldShelf()
      })
      railLayers?.addEventListener('click', () => {
        if (!layerPanel.hidden) { layerPanel.hidden = true; syncRail() }
        else openLayerPanel()
      })
      railAi?.addEventListener('click', () => {
        if (!aiPanel.hidden) { aiPanel.hidden = true; syncRail() }
        else openAiPanel()
      })
      railMore?.addEventListener('click', event => { event.stopPropagation(); openMoreMenu() })
      document.getElementById('noven-world-close')?.addEventListener('click', () => { worldPanel.hidden = true; syncRail() })
      document.getElementById('noven-layers-close')?.addEventListener('click', () => { layerPanel.hidden = true; syncRail() })
      document.getElementById('noven-ai-close')?.addEventListener('click', () => { aiPanel.hidden = true; syncRail() })
      worldSearch?.addEventListener('input', renderWorld)
      document.getElementById('noven-world-add')?.addEventListener('click', event => {
        event.stopPropagation()
        openAddMenu(event.currentTarget)
      })
      document.getElementById('noven-world-gen')?.addEventListener('click', openGenerationSheet)
      presetSelect?.addEventListener('change', () => {
        const hiddenPreset = frame.contentDocument?.getElementById('layersPreset')
        if (hiddenPreset !== null && hiddenPreset !== undefined) {
          hiddenPreset.value = presetSelect.value
          hiddenPreset.dispatchEvent(new Event('change', { bubbles: true }))
        }
        window.setTimeout(() => { renderLayers(); syncViewButtons() }, 120)
      })
      for (const button of layerPanel?.querySelectorAll('[data-view]') ?? []) {
        button.addEventListener('click', () => {
          const id = { standard: 'viewStandard', mesh: 'viewMesh', globe: 'viewGlobe' }[button.dataset.view]
          frame.contentDocument?.getElementById(id)?.click()
          window.setTimeout(syncViewButtons, 260)
        })
      }
      aiUndoPanel?.addEventListener('click', () => { undoAi(); window.setTimeout(refreshAiPanel, 220) })
      dockPrimary?.addEventListener('click', () => {
        if (currentStage === 'world') saveToCard('world')
        else if (currentStage === 'terrain') openGenerationSheet()
        else finalizeTerrain()
      })
      dockUndo?.addEventListener('click', () => {
        if (currentStage === 'world') undoAi()
        else frame.contentDocument?.getElementById('undo')?.click()
        window.setTimeout(syncDock, 120)
      })
      dockRedo?.addEventListener('click', () => {
        frame.contentDocument?.getElementById('redo')?.click()
        window.setTimeout(syncDock, 120)
      })
      dockFullscreen?.addEventListener('click', () => {
        window.parent.postMessage({ type: 'noven-map-fullscreen-toggle' }, '*')
      })
      document.getElementById('noven-more-blank')?.addEventListener('click', () => {
        toolsMenu.hidden = true
        void startBlank({ fresh: true })
      })
      document.getElementById('noven-more-random')?.addEventListener('click', () => {
        toolsMenu.hidden = true
        randomButton.click()
      })
      document.getElementById('noven-more-settings')?.addEventListener('click', () => {
        toolsMenu.hidden = true
        openOptionsEditor()
      })
      bootAction?.addEventListener('click', () => {
        if (bootEl !== null) bootEl.hidden = true
        void startBlank({ fresh: true })
      })
      document.getElementById('noven-more-submap')?.addEventListener('click', () => openController('SubmapTool'))
      document.getElementById('noven-more-transform')?.addEventListener('click', () => openController('TransformTool'))
      document.getElementById('noven-more-wrap')?.addEventListener('click', () => openController('WrapTool'))
      document.getElementById('noven-gen-close')?.addEventListener('click', () => { genSheet.hidden = true })
      document.getElementById('noven-gen-cancel')?.addEventListener('click', () => { genSheet.hidden = true })
      genRun?.addEventListener('click', async () => {
        const number = (id, fallback) => {
          const input = document.getElementById(id)
          const value = Number(input?.value)
          return Number.isFinite(value) ? value : fallback
        }
        const options = {
          states: Math.max(2, Math.round(number('noven-gen-states', 20))),
          provinces: Math.min(1, Math.max(0, number('noven-gen-provinces', 0.5))),
          cultures: Math.max(1, Math.round(number('noven-gen-cultures', 8))),
          religions: Math.max(1, Math.round(number('noven-gen-religions', 6))),
          burgs: Math.max(10, Math.round(number('noven-gen-burgs', 120))),
        }
        const seed = document.getElementById('noven-gen-seed')?.value?.trim()
        genRun.disabled = true
        genRun.textContent = '生成中…'
        try {
          await generateHumanLayer(seed ? { ...options, seed } : options)
        } finally {
          genRun.disabled = false
          genRun.textContent = '生成人文层'
          genSheet.hidden = true
          window.setTimeout(syncDock, 200)
        }
      })
      document.addEventListener('click', event => {
        if (toolsMenu !== null && !toolsMenu.hidden && !toolsMenu.contains(event.target) && !railMore.contains(event.target)) {
          toolsMenu.hidden = true
        }
      })
      document.addEventListener('keydown', event => {
        const target = event.target
        const typing = target instanceof HTMLElement
          && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)
        if (typing) return
        if (event.key === 'Escape') {
          closePanels()
          genSheet.hidden = true
          document.getElementById('noven-add-menu')?.remove()
          return
        }
        if (event.metaKey || event.ctrlKey || event.altKey) return
        if (event.key === 'b' || event.key === 'B') openBrushShelf()
        if (event.key === 'w' || event.key === 'W') openWorldShelf()
        if (event.key === 'l' || event.key === 'L') openLayerPanel()
      })
      renderRebuild()
      refreshAiPanel()
      syncDock()
      window.setInterval(syncDock, 500)
    }

    /** Strip the hover box and clear a hover tip after it has been read. */
    function bindTooltipFade(doc) {
      const tip = doc.getElementById('tooltip')
      if (tip === null || tip.dataset.novenFade === 'on') return
      tip.dataset.novenFade = 'on'
      let timer = 0
      const schedule = () => {
        window.clearTimeout(timer)
        timer = window.setTimeout(() => {
          const text = (tip.textContent ?? '').trim()
          // A pinned mode tip is the current message; only transient hover text fades.
          if (text === '' || tip.dataset.main === tip.innerHTML) return
          tip.classList.add('noven-tip-fading')
          window.setTimeout(() => {
            if (!tip.classList.contains('noven-tip-fading')) return
            tip.innerHTML = ''
            tip.classList.remove('noven-tip-fading')
          }, 500)
        }, 1600)
      }
      new MutationObserver(() => {
        const text = (tip.textContent ?? '').trim()
        if (text === (tip.dataset.novenText ?? '')) return
        tip.dataset.novenText = text
        tip.classList.remove('noven-tip-fading')
        if (text !== '') schedule()
      }).observe(tip, { childList: true, subtree: true, characterData: true })
    }

      }
      draftKey = ''
      draftMeta = null
    }

    function restoreDraft(draft) {
      const w = frame.contentWindow
      if (!w?.grid?.cells?.h) return
      const heights = decodeHeights(draft.heights)
      if (heights.length !== w.grid.cells.h.length) return
      w.grid.cells.h.set(heights)
      w.Controllers.HeightmapEditor.open({ mode: 'erase' })
      setState('白膜 · 已恢复草稿')
    }

    function handleBlankStarted() {
      finalized = false
      narrowBrushCollapsed = false
      frame.contentWindow?.clearMainTip?.()
      setState('白膜 · 先涂地形')
      saveButton.disabled = true
      finalizeButton.hidden = false
      finalizeButton.disabled = false
      updateBar()
      if ((frame.clientWidth ?? 0) < 700) {
        narrowBrushCollapsed = true
        try { frame.contentWindow?.jQuery('#brushesPanel').dialog('close') } catch (error) {
          console.warn('Noven narrow brush collapse failed', error)
        }
        setState('白膜 · 从左侧「画笔」打开')
      }
      window.setTimeout(syncDock, 180)
      if (embedded) window.parent.postMessage({ type: 'noven-map-blank-started' }, '*')
    }

    function handleTerrainFinalized(detail) {
      if (finalized) return
      finalized = true
      if (detail?.ok === false) {
        setState('地形定稿失败', true)
        finalizeButton.disabled = false
        return
      }
      clearDraft()
      currentStage = 'terrain'
      updateBar()
      frame.contentWindow?.novenMap?.fit?.()
      window.setTimeout(() => {
        openWorldShelf()
        syncDock()
      }, 160)
      setState('地形已定稿')
      finalizeButton.hidden = true
      humanButton.hidden = false
      saveButton.disabled = !embedded
      if (embedded) {
        window.parent.postMessage({ type: 'noven-map-terrain-finalized' }, '*')
        saveToCard('terrain')
      }
    }

    async function startBlank(options = {}) {
      if (!ready) return
      if (typeof options.undoKey === 'string') undoStorageKey = options.undoKey
      clearUndoHistory()
      const key = typeof options.draftKey === 'string' ? options.draftKey : draftKey
      if (options.fresh === true && key) {
        try { localStorage.removeItem(key) } catch { /* storage may be unavailable */ }
      }
      draftKey = key
      const saved = options.fresh === true ? undefined : (draftKey ? readDraft(draftKey) : undefined)
      const seed = saved?.seed ?? options.seed ?? `noven-blank-${Date.now()}`
      const width = saved?.width ?? options.width ?? 1280
      const height = saved?.height ?? options.height ?? 800
      const points = saved?.points ?? options.points ?? 10000
      draftMeta = { seed, width, height, points }
      currentStage = 'blank'
      updateBar()
      blankButton.disabled = true
      randomButton.disabled = true
      finalizeButton.hidden = true
      humanButton.hidden = true
      setState(saved ? '白膜 · 恢复草稿…' : '白膜准备中…')
      try {
        await frame.contentWindow.novenMap.startBlank({ seed, width, height, points })
        if (saved) restoreDraft(saved)
        frame.contentWindow?.clearMainTip?.()
        setState(saved ? '白膜 · 已恢复草稿' : '白膜 · 先涂地形')
        saveButton.disabled = true
        finalizeButton.hidden = false
        finalizeButton.disabled = false
      } catch (error) {
        setState('白膜启动失败', true)
        console.error('Noven blank map failed', error)
      } finally {
        blankButton.disabled = false
        randomButton.disabled = false
      }
    }

    async function finalizeTerrain() {
      if (!ready || frame.contentWindow?.novenBlank !== true) return
      finalizeButton.disabled = true
      setState('定稿中…')
      try {
        await frame.contentWindow.novenMap.finalize()
      } catch (error) {
        setState('地形定稿失败', true)
        console.error('Noven terrain finalize failed', error)
      }
      if (frame.contentWindow?.novenBlank === true) {
        setState('陆地不足 200 块，继续涂', true)
        finalizeButton.disabled = false
        return
      }
      handleTerrainFinalized({ ok: true })
    }

    async function generateHumanLayer(options = {}) {
      if (!ready || frame.contentWindow?.novenBlank === true) return
      humanButton.disabled = true
      setState('生成人文层中…')
      try {
        await frame.contentWindow.novenMap.generateHuman(options)
        frame.contentWindow.novenMap.fit?.()
        frame.contentWindow.Layers?.hide?.('ice', 'scaleBar')
        currentStage = 'world'
        updateBar()
        clearUndoHistory()
        humanButton.hidden = true
        humanButton.disabled = false
        setState('人文层已生成')
        syncDock()
        if (embedded) window.parent.postMessage({ type: 'noven-map-human-generated' }, '*')
        saveToCard('world')
      } catch (error) {
        humanButton.disabled = false
        setState('生成人文层失败', true)
        toast('生成人文层失败，请重试')
        console.error('Noven human layer generation failed', error)
      }
    }

    async function composeMapTerrain(spec) {
      const api = frame.contentWindow?.novenMap
      if (!ready || !api || spec === null || typeof spec !== 'object' || Array.isArray(spec)) return
      if (frame.contentWindow?.novenBlank !== true) {
        setState('先在白膜上起稿', true)
        return
      }
      setState('AI 地形起稿中…')
      try {
        const summary = api.composeTerrain(spec)
        window.setTimeout(() => setState(`AI 地形 · 陆地 ${Math.round(summary.landRatio * 100)}%`), 0)
        setAiToolsStatus(`地形已起稿 · 陆地 ${Math.round(summary.landRatio * 100)}%`, false)
        window.parent.postMessage({ type: 'noven-map-terrain-summary', summary }, '*')
      } catch (error) {
        setState('AI 地形起稿失败', true)
        console.error('Noven terrain composition failed', error)
      }
    }

    async function paintMapTerrain(operations) {
      const api = frame.contentWindow?.novenMap
      if (!ready || !api || !Array.isArray(operations) || operations.length === 0) return
      if (frame.contentWindow?.novenBlank !== true) {
        setState('先在白膜上起稿', true)
        return
      }
      setState('AI 改地形中…')
      try {
        const normalized = operations.map(item => {
          if (item === null || typeof item !== 'object' || typeof item.op !== 'string') throw new Error('地形动作格式不对')
          const args = item.args
          if (args === null || typeof args !== 'object' || Array.isArray(args)) throw new Error('地形动作缺少参数')
          return { ...args, op: item.op }
        })
        const summary = api.paintTerrain(normalized)
        window.setTimeout(() => setState(`AI 地形 · 陆地 ${Math.round(summary.landRatio * 100)}%`), 0)
        setAiToolsStatus(`地形已调整 · 陆地 ${Math.round(summary.landRatio * 100)}%`, false)
        window.parent.postMessage({ type: 'noven-map-terrain-summary', summary }, '*')
      } catch (error) {
        setState('AI 改地形失败', true)
        console.error('Noven terrain paint failed', error)
      }
    }

    async function applyMapEdit(operations, undoKey) {
      const api = frame.contentWindow?.novenMap
      if (!ready || !api || !Array.isArray(operations) || operations.length === 0) return
      if (typeof undoKey === 'string') undoStorageKey = undoKey
      setState('AI 改图中…')
      try {
        const result = api.applyOperations(operations, undoStorageKey)
        setState(`AI 已改图 · ${result.applied} 项`)
        if (aiLog && aiLogText) {
          aiLogText.textContent = `AI 改动 · ${result.applied} 项`
          aiLog.hidden = false
        }
        setAiToolsStatus(`已改 ${result.applied} 项`, true)
        if (embedded) window.parent.postMessage({ type: 'noven-map-edited', applied: result.applied }, '*')
        saveToCard(currentStage)
      } catch (error) {
        setState('AI 改图失败', true)
        console.error('Noven AI map edit failed', error)
        if (embedded) window.parent.postMessage({ type: 'noven-map-edit-failed', message: String(error) }, '*')
      }
    }

    function undoAi() {
      const api = frame.contentWindow?.novenMap
      if (!ready || !api?.undoOperations) return
      try {
        const undone = api.undoOperations(undoStorageKey)
        if (!undone) {
          setState('没有可撤销的 AI 改动')
          setAiToolsStatus('暂无可撤销', false)
          if (aiLog) aiLog.hidden = true
          return
        }
        const remaining = undoCount()
        if (aiLogText) aiLogText.textContent = `已撤销 AI 改动 · ${undone.undone} 项`
        setAiToolsStatus(remaining > 0 ? `已撤销 · 还可撤销 ${remaining} 批` : '已撤销', remaining > 0)
        setState('已撤销 AI 改动')
        saveToCard(currentStage)
        window.setTimeout(() => { if (aiLog) aiLog.hidden = true }, 1800)
      } catch (error) {
        setState('撤销 AI 改动失败', true)
        console.error('Noven AI undo failed', error)
      }
    }

    function saveToCard(stage = currentStage) {
      if (!embedded || !ready) return
      if (saving) {
        window.setTimeout(() => saveToCard(stage), 350)
        return
      }
      if (stage === 'blank' || frame.contentWindow?.novenBlank === true) {
        setState('白膜尚未定稿', true)
        return
      }
      const api = frame.contentWindow?.novenMap
      if (api === undefined) return
      saving = true
      saveButton.disabled = true
      setState('保存中…')
      try {
        const data = api.save()
        let summary
        try {
          const full = api.summary?.()
          if (full) summary = { ...full, burgs: full.burgs.slice(0, 120) }
        } catch (summaryError) {
          console.warn('Noven map summary failed', summaryError)
        }
        window.parent.postMessage({ type: 'noven-map-save', data, stage, summary }, '*')
      } catch (error) {
        saving = false
        saveButton.disabled = false
        setState('保存失败', true)
        console.error('Noven map save failed', error)
      }
    }

    async function generate(options) {
      if (!ready) return
      closePanels()
      if (typeof options.undoKey === 'string') undoStorageKey = options.undoKey
      clearUndoHistory()
      clearDraft()
      finalized = false
      currentStage = 'world'
      updateBar()
      syncDock()
      finalizeButton.hidden = true
      humanButton.hidden = true
      saveButton.disabled = true
      blankButton.disabled = true
      randomButton.disabled = true
      setState('生成中…')
      try {
        const win = frame.contentWindow
        // Replacing the map from the heightmap editor must leave customization
        // first, otherwise the old blank overlay and its black heightmap stay on top.
        win.customization = 0
        try { win.jQuery?.('#brushesPanel')?.dialog?.('close') } catch { /* dialog may not be open */ }
        try { win.closeDialogs?.() } catch { /* dialogs may not be open */ }
        win.HeightmapGenerator?.clearData?.()
        win.document.getElementById('noven-blank-hint')?.remove()
        win.document.getElementById('heights')?.remove()
        win.document.body.classList.remove('noven-blank', 'noven-terrain')
        const exit = win.document.getElementById('exitCustomization')
        if (exit !== null && exit !== undefined) exit.style.display = 'none'
        const customizationMenu = win.document.getElementById('customizationMenu')
        if (customizationMenu !== null && customizationMenu !== undefined) customizationMenu.style.display = 'none'
        const preset = win.document.getElementById('layersPreset')
        if (preset !== null && preset !== undefined) preset.disabled = false
        await frame.contentWindow.novenMap.generate(options)
        if (preset !== null && preset !== undefined) {
          preset.value = 'political'
          preset.dispatchEvent(new Event('change', { bubbles: true }))
        }
        win.Layers?.drawAll?.()
        win.Layers?.hide?.('scaleBar')
        frame.contentWindow.novenMap.fit?.()
        win.Layers?.hide?.('ice', 'scaleBar')
        setState('生成完成')
        syncDock()
        window.parent.postMessage({ type: 'noven-map-generated' }, '*')
        saveToCard('world')
      } catch (error) {
        setState('生成失败', true)
        toast('生成世界失败，请重试')
        console.error('Noven map generation failed', error)
      } finally {
        blankButton.disabled = false
        randomButton.disabled = false
      }
    }

    window.addEventListener('message', event => {
      if (event.source !== window.parent) return
      const data = event.data
      if (data?.type === 'noven-map-saved') {
        saving = false
        saveButton.disabled = false
        setState('已保存到卡')
      } else if (data?.type === 'noven-map-save-failed') {
        saving = false
        saveButton.disabled = false
        setState(data.message || '保存失败', true)
      } else if (data?.type === 'noven-map-load' && typeof data.data === 'string') {
        if (typeof data.undoKey === 'string') undoStorageKey = data.undoKey
        clearDraft()
        setState('载入中…')
        frame.contentWindow?.novenMap?.load(data.data)
          .then(async () => {
            const win = frame.contentWindow
            const loading = win?.document.getElementById('loading')
            if (loading) loading.style.display = 'none'
            win?.novenMap?.fit?.()
            win?.Layers?.hide?.('ice', 'scaleBar')
            const states = (win?.pack?.states ?? []).filter(state => state?.i && !state.removed).length
            const cultures = (win?.pack?.cultures ?? []).filter(culture => culture?.i && !culture.removed).length
            if (states === 0 && cultures <= 1) {
              currentStage = 'terrain'
              updateBar()
              humanButton.hidden = false
              win?.novenMap?.showTerrain?.()
              clearUndoHistory()
              window.parent.postMessage({ type: 'noven-map-terrain-finalized' }, '*')
            } else {
              currentStage = 'world'
              updateBar()
              humanButton.hidden = true
              refreshUndoStatus()
            }
            setState('已载入')
            syncDock()
            if (!worldPanel.hidden) renderWorld()
            window.parent.postMessage({ type: 'noven-map-loaded' }, '*')
            if (Array.isArray(data.afterEdit) && data.afterEdit.length > 0) {
              await applyMapEdit(data.afterEdit, data.undoKey)
            }
            if (data.afterHuman === true && currentStage === 'terrain') await generateHumanLayer()
          })
          .catch(error => {
            console.error('Noven map load failed', error)
            setState('载入失败', true)
            window.parent.postMessage({ type: 'noven-map-load-failed', message: String(error) }, '*')
          })
      } else if (data?.type === 'noven-map-fullscreen' && typeof data.expanded === 'boolean') {
        fullscreenButton.classList.toggle('active', data.expanded)
        fullscreenButton.title = data.expanded ? '退出全屏' : '全屏'
        fullscreenButton.setAttribute('aria-pressed', String(data.expanded))
        dockFullscreen.classList.toggle('active', data.expanded)
        dockFullscreen.title = data.expanded ? '退出全屏' : '全屏'
      } else if (data?.type === 'noven-map-generate' && data.options !== null && typeof data.options === 'object') {
        void generate(data.options)
      } else if (data?.type === 'noven-map-blank') {
        void startBlank(data.options || {})
      } else if (data?.type === 'noven-map-finalize') {
        void finalizeTerrain()
      } else if (data?.type === 'noven-map-human') {
        void generateHumanLayer()
      } else if (data?.type === 'noven-map-compose' && data.spec !== null && typeof data.spec === 'object') {
        void composeMapTerrain(data.spec)
      } else if (data?.type === 'noven-map-paint' && Array.isArray(data.operations)) {
        void paintMapTerrain(data.operations)
      } else if (data?.type === 'noven-map-edit' && Array.isArray(data.operations)) {
        void applyMapEdit(data.operations, data.undoKey)
      } else if (data?.type === 'noven-map-stage' && (data.stage === 'terrain' || data.stage === 'world')) {
        currentStage = data.stage
        humanButton.hidden = data.stage !== 'terrain'
        if (data.stage === 'terrain') frame.contentWindow?.novenMap?.showTerrain?.()
        else frame.contentWindow?.document.body.classList.remove('noven-terrain')
      }
    })

    window.addEventListener('message', event => {
      // The undo button lives in the editor iframe. Standalone previews have no
      // parent, so accept the host window itself as well as the editor frame.
      if (event.source !== frame.contentWindow && event.source !== window) return
      if (event.data?.type === 'noven-map-ai-undo') undoAi()
    })

    frame.addEventListener('load', () => {
      ready = false
      announced = false
      finalized = false
      bootSince = Date.now()
      if (bootEl !== null) bootEl.hidden = false
      window.novenHostReady = false
      setState('连接中…')
      apply()
      setInterval(apply, 1200)
      // The upstream autosave is an existing signal that the map changed.
      const timer = setInterval(() => {
        const win = frame.contentWindow
        if (!win || !win.novenMapReady) return
        clearInterval(timer)
        win.addEventListener('noven:map-saved', () => { if (embedded) saveToCard() })
      }, 400)
    })

    saveButton.addEventListener('click', saveToCard)
    fullscreenButton.addEventListener('click', () => window.parent.postMessage({ type: 'noven-map-fullscreen-toggle' }, '*'))
    blankButton.addEventListener('click', () => { void startBlank({ fresh: true }) })
    finalizeButton.addEventListener('click', () => { void finalizeTerrain() })
    humanButton.addEventListener('click', () => { void generateHumanLayer() })
    aiUndoButton?.addEventListener('click', undoAi)
    randomButton.addEventListener('click', () => generate({ template: 'continents', seed: `noven-${Date.now()}`, width: 1280, height: 800, points: 10000 }))
    window.addEventListener('beforeunload', () => { if (frame.contentWindow?.novenBlank === true) saveDraft() })
    wireShell()
  </script>
  <script src="./noven-i18n.js?v=13"></script>
</body>
