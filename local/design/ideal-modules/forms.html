<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多形态 · 目标稿</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="page">
  <div class="crumb"><b>‹</b><span>沈青梧</span></div>

  <header class="pagehead">
    <div>
      <h1>多形态</h1>
      <div class="sub">角色 · 多形态</div>
    </div>
    <div class="headmeta">
      <span class="count">1 个形态</span>
      <button class="addlink" type="button"><span>＋</span>新形态</button>
    </div>
  </header>

  <section class="forms-grid" aria-label="多形态">
    <article class="form-card">
      <div class="form-visual">
        <svg viewBox="0 0 172 382" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#22302D"/>
              <stop offset=".55" stop-color="#31433C"/>
              <stop offset="1" stop-color="#17211E"/>
            </linearGradient>
            <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F4EFDF"/>
              <stop offset="1" stop-color="#D9D2BC"/>
            </linearGradient>
          </defs>
          <rect width="172" height="382" fill="url(#night)"/>
          <circle cx="112" cy="92" r="38" fill="url(#moon)" opacity=".92"/>
          <circle cx="112" cy="92" r="52" fill="none" stroke="#D9D2BC" stroke-width=".8" opacity=".18"/>
          <path d="M0 258 38 214 74 242 108 202 144 232 172 214V382H0Z" fill="#16211E" opacity=".96"/>
          <path d="M0 292 44 262 86 288 128 252 172 282V382H0Z" fill="#0E1715" opacity=".92"/>
          <path d="M20 338c34-10 68-10 102 0s34 10 50 2" fill="none" stroke="#6F8F82" stroke-width=".9" opacity=".35"/>
          <path d="M86 148v184" stroke="#D8C9A8" stroke-width="1.6" opacity=".7"/>
          <path d="M76 166 86 148 96 166" fill="none" stroke="#D8C9A8" stroke-width="1.6" opacity=".7"/>
          <circle cx="86" cy="148" r="3.2" fill="#D8C9A8" opacity=".8"/>
          <path d="M60 332h52" stroke="#D8C9A8" stroke-width="2" opacity=".55"/>
          <circle cx="146" cy="336" r="7" fill="#B6544A" opacity=".75"/>
          <path d="M143 332v8M149 332v8" stroke="#F1EAD8" stroke-width=".8" opacity=".7"/>
        </svg>
      </div>
      <div class="form-main">
        <div class="form-eyebrow">形态 · 02</div>
        <h2 class="form-name">玄夜</h2>
        <p class="form-base">继承自 沈青梧</p>
        <div class="form-facts">
          <div class="form-fact"><span class="label">身份</span><span class="value"><span class="old">玄天宗内门弟子</span><span class="arrow">→</span><span class="new">玄天宗执法弟子</span></span></div>
          <div class="form-fact"><span class="label">年龄</span><span class="value"><span class="old">19</span><span class="arrow">→</span><span class="new">21</span></span></div>
          <div class="form-fact"><span class="label">阵营</span><span class="value"><span class="old">玄天宗</span><span class="arrow">→</span><span class="new">玄天宗 · 戒律堂</span></span></div>
          <div class="form-fact"><span class="label">出身</span><span class="value">北境<span class="inherit">继承</span></span></div>
        </div>
        <p class="form-desc">堕入玄夜之后的形态。左眼失明，剑上缠着一段旧布。</p>
        <div class="form-foot">打开角色档案 →</div>
      </div>
    </article>

    <article class="form-card is-empty">
      <div class="form-visual"><span>＋ 形象</span></div>
      <div class="form-main">
        <div class="form-eyebrow">新形态</div>
        <h2 class="form-name">形态名称<span class="caret"></span></h2>
        <p class="form-base">继承自 沈青梧</p>
        <div class="form-facts">
          <div class="form-fact"><span class="label">身份</span><span class="value"><span class="old">玄天宗内门弟子</span><span class="arrow">→</span><span class="new">同继承</span></span></div>
          <div class="form-fact"><span class="label">年龄</span><span class="value"><span class="old">19</span><span class="arrow">→</span><span class="new">同继承</span></span></div>
          <div class="form-fact"><span class="label">阵营</span><span class="value"><span class="old">玄天宗</span><span class="arrow">→</span><span class="new">同继承</span></span></div>
          <div class="form-fact"><span class="label">出身</span><span class="value"><span class="old">北境</span><span class="arrow">→</span><span class="new">同继承</span></span></div>
        </div>
        <p class="form-desc">这个形态和本体有什么不同？</p>
      </div>
    </article>
  </section>
</main>
</body>
</html>
