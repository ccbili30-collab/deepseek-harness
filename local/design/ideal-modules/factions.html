<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>势力 · 目标稿</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="page">
  <div class="crumb"><b>‹</b><span>玄天大陆</span></div>

  <header class="pagehead">
    <div>
      <h1>势力</h1>
      <div class="sub">世界 · 势力</div>
    </div>
    <div class="headmeta">
      <span class="count">2 个势力</span>
      <button class="addlink" type="button"><span>＋</span>新势力</button>
    </div>
  </header>

  <section class="factions-grid" aria-label="势力">
    <article class="faction-card">
      <div class="crest">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 7 87 21v33c0 21-16 33-37 40C29 87 13 75 13 54V21Z" fill="#EAF5EE" stroke="#B9DCC8" stroke-width="1.2"/>
          <path d="M50 13 81 25v29c0 18-14 28-31 34-17-6-31-16-31-34V25Z" fill="none" stroke="#8FC9A7" stroke-width=".8" opacity=".7"/>
          <path d="M28 65 43 40 51 54 60 34 74 65Z" fill="#5FAE88"/>
          <path d="M50 24v52" stroke="#C9A86A" stroke-width="2.2"/>
          <path d="M43 32 50 24 57 32" fill="none" stroke="#C9A86A" stroke-width="2.2"/>
          <circle cx="50" cy="24" r="2.6" fill="#C9A86A"/>
        </svg>
      </div>
      <h2 class="faction-name">玄天宗</h2>
      <p class="faction-stance">正道 · 剑修</p>
      <div class="faction-facts">
        <div class="faction-fact"><span>实力</span><b>三阶</b></div>
        <div class="faction-fact"><span>驻地</span><b>北境 · 玄天峰</b></div>
        <div class="faction-fact"><span>首领</span><b>沈青梧</b></div>
      </div>
      <p class="faction-desc">以剑立宗，守北境灵脉。门规只有一条：剑不向无辜者出鞘。</p>
      <div class="faction-foot">查看详情 →</div>
    </article>

    <article class="faction-card">
      <div class="crest">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 7 87 21v33c0 21-16 33-37 40C29 87 13 75 13 54V21Z" fill="#F2F6F4" stroke="#B9DCC8" stroke-width="1.2"/>
          <circle cx="50" cy="39" r="17" fill="#2B3B3A"/>
          <circle cx="57" cy="34" r="17" fill="#F2F6F4"/>
          <path d="M36 70V44h8V35h12v9h8v26Z" fill="#31433C"/>
          <rect x="46" y="48" width="8" height="8" fill="#C9A86A"/>
          <path d="M30 70h40" stroke="#5FAE88" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="faction-name">照夜司</h2>
      <p class="faction-stance">中立 · 缉查</p>
      <div class="faction-facts">
        <div class="faction-fact"><span>实力</span><b>二阶</b></div>
        <div class="faction-fact"><span>驻地</span><b>中州 · 照夜台</b></div>
        <div class="faction-fact"><span>首领</span><b>裴照</b></div>
      </div>
      <p class="faction-desc">昼伏夜出的缉查机构，专查私采灵脉与禁术。</p>
      <div class="faction-foot">查看详情 →</div>
    </article>

    <article class="faction-card is-empty">
      <div class="crest">＋ 徽记</div>
      <h2 class="faction-name">新势力<span class="caret"></span></h2>
      <p class="faction-stance">立场</p>
      <div class="faction-facts">
        <div class="faction-fact"><span>实力</span><b>—</b></div>
        <div class="faction-fact"><span>驻地</span><b>选一个地方</b></div>
        <div class="faction-fact"><span>首领</span><b>—</b></div>
      </div>
      <p class="faction-desc">一句话说明这个势力。</p>
    </article>
  </section>
</main>
</body>
</html>
