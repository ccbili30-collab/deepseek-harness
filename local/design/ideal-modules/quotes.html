<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语录 · 目标稿</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="page">
  <div class="crumb"><b>‹</b><span>沈青梧</span></div>

  <header class="pagehead">
    <div>
      <h1>语录</h1>
      <div class="sub">角色 · 语录</div>
    </div>
    <div class="headmeta">
      <span class="count">8 句</span>
      <button class="addlink" type="button"><span>＋</span>新语录</button>
    </div>
  </header>

  <section class="quotes-grid" aria-label="语录">
    <article class="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text">雪落下来之前，山门的风会先停。</p>
      <div class="quote-meta">
        <span><small>场景</small><b>雪夜山门</b></span>
        <span><small>情绪</small><b>克制</b></span>
        <span><small>对象</small><b>师父</b></span>
      </div>
    </article>

    <article class="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text">我不是要赢，我只是不想再输给同一个人。</p>
      <div class="quote-meta">
        <span><small>场景</small><b>试剑台</b></span>
        <span><small>情绪</small><b>不甘</b></span>
        <span><small>对象</small><b>裴照</b></span>
      </div>
    </article>

    <article class="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text">剑是冷的，握剑的人不能冷。</p>
      <div class="quote-meta">
        <span><small>场景</small><b>玄天峰</b></span>
        <span><small>情绪</small><b>平静</b></span>
        <span><small>对象</small><b>自己</b></span>
      </div>
    </article>

    <article class="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text">我答应过一个人，要活着回来。</p>
      <div class="quote-meta">
        <span><small>场景</small><b>北境雪原</b></span>
        <span><small>情绪</small><b>隐忍</b></span>
        <span><small>对象</small><b>师姐</b></span>
      </div>
    </article>

    <article class="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text">若这世道非要人跪着活，那我宁可站着死。</p>
      <div class="quote-meta">
        <span><small>场景</small><b>照夜台</b></span>
        <span><small>情绪</small><b>决绝</b></span>
        <span><small>对象</small><b>裴照</b></span>
      </div>
    </article>

    <article class="quote-card is-empty">
      <div class="quote-mark">“</div>
      <p class="quote-text">写一句别人会记住的话<span class="caret"></span></p>
      <div class="quote-meta">
        <span><small>场景</small><b>写在哪儿</b></span>
        <span><small>情绪</small><b>什么情绪</b></span>
        <span><small>对象</small><b>对谁说</b></span>
      </div>
    </article>
  </section>
</main>
</body>
</html>
