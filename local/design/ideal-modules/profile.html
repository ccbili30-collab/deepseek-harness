      <h3>天地</h3>
      <p>玄天大陆分为北境、中州、南海三境。北境多山，灵脉埋于雪下；中州是王朝与宗门的交界；南海之外，就是归墟。</p>
      <p>灵息是天地间唯一的活水。它从灵脉涌出，经过修士、法器与阵眼，最后回到天地。没有人见过灵息的源头，也没有人见过它真正枯竭。</p>
