<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规则 · 目标稿</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="page">
  <div class="crumb"><b>‹</b><span>玄天大陆</span></div>

  <header class="pagehead">
    <div>
      <h1>规则</h1>
      <div class="sub">世界 · 规则</div>
    </div>
    <div class="headmeta">
      <span class="count">12 条</span>
      <button class="addlink" type="button"><span>＋</span>新规则</button>
    </div>
  </header>

  <div class="rules-wrap">
    <nav class="rail" aria-label="规则分类">
      <p class="rail-label">分类</p>
      <button class="rail-item" type="button"><span>全部</span><small>12</small></button>
      <button class="rail-item active" type="button"><span>修行</span><small>3</small></button>
      <button class="rail-item" type="button"><span>天地</span><small>2</small></button>
      <button class="rail-item" type="button"><span>势力</span><small>4</small></button>
      <button class="rail-item" type="button"><span>禁忌</span><small>2</small></button>
      <button class="rail-item" type="button"><span>生活</span><small>1</small></button>
      <button class="rail-add" type="button">＋ 分类</button>
    </nav>

    <section class="rule-section" aria-label="修行">
      <div class="section-head">修行</div>

      <article class="rule-item">
        <div class="rule-no">01</div>
        <div>
          <h2 class="rule-title">灵息守恒</h2>
          <p class="rule-body">灵息不会凭空产生，也不会凭空消失；它只在修士、法器与天地之间转移。</p>
          <p class="rule-detail">因此，任何强行抽取灵息的法术，都会在别处留下同等规模的枯竭。</p>
          <a class="rule-rel" href="#">灵息体系 →</a>
        </div>
      </article>

      <article class="rule-item">
        <div class="rule-no">02</div>
        <div>
          <h2 class="rule-title">境界九重</h2>
          <p class="rule-body">修士以灵息淬炼经脉，一境一重天。破境需要契机，不以年月计。</p>
        </div>
      </article>

      <article class="rule-item">
        <div class="rule-no">03</div>
        <div>
          <h2 class="rule-title">破境代价</h2>
          <p class="rule-body">每次破境都要献祭一段记忆；境界越高，忘掉的东西越重要。</p>
        </div>
      </article>

      <article class="rule-item rule-new">
        <div class="rule-no">04</div>
        <div>
          <h2 class="rule-title">写一条新规则<span class="caret"></span></h2>
          <p class="rule-body">这条规则如何运作？</p>
          <div class="rule-meta"><span>分类</span><b>未分类 ▾</b></div>
        </div>
      </article>
    </section>
  </div>
</main>
</body>
</html>
